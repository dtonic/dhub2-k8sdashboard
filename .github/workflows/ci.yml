name: CI

# 로컬과 CI가 **같은 명령**을 씁니다. (이슈 #3 완료 기준)
# 여기서 새 명령을 만들지 말고 Makefile 타깃을 호출하세요.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web (typecheck · build · e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
          cache: npm
      - run: make install-ci
      - name: 타입체크 · design-system preview 검증
        run: make check
      - name: Unit, component, contract and schema tests
        run: make web-unit contract-test
      - name: Dependency advisory gate
        run: make dependency-audit
      - name: 빌드 (Web/디자인 시스템만 — Go 툴체인 불필요)
        run: make build-web
      - name: Production Web build (MSW excluded)
        run: make build-web-production
      - name: Production bundle budget
        run: make web-performance
      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: E2E (mock API 위에서 실행 — 클러스터 불필요)
        run: make test-web
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.26.6"
          cache-dependency-path: apps/api/go.sum
      - name: 통합 E2E (#22 — 프로덕션 번들 + Go BFF fixture · 클러스터 불필요)
        run: make test-web-integration
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  api:
    name: API (vet · test · build)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.2.6-alpine@sha256:ea5a07305d6c66f99df5a5ff8d9659e8f6cb598e6e586dc8dd92b7fcd915746e
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
      postgres:
        image: cgr.dev/chainguard/postgres@sha256:844baac51caa0212727f9a53f25beec94cedb6778c06c75e3f7bb092079142f3
        env:
          POSTGRES_PASSWORD: dashboard-ci-only
          POSTGRES_DB: dashboard_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dashboard_ci"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.26.6"
          cache-dependency-path: apps/api/go.sum
      - run: go version
      - run: make api-vet
      - run: make api-coverage
        env:
          DASHBOARD_POSTGRES_TEST_URL: postgres://postgres:dashboard-ci-only@127.0.0.1:5432/dashboard_ci?sslmode=disable
      - run: make api-race
      - run: make api-govuln
      - run: make api-redis-itest
        env:
          REDIS_ITEST_ADDR: 127.0.0.1:6379
      - run: make api-postgres-itest
        env:
          DASHBOARD_POSTGRES_TEST_URL: postgres://postgres:dashboard-ci-only@127.0.0.1:5432/dashboard_ci?sslmode=disable
      - name: Integration contracts (external adapters skip without endpoints)
        run: make api-itest
        env:
          REDIS_ITEST_ADDR: 127.0.0.1:6379
      - run: make api-build
      - run: make api-performance

  deploy:
    name: Deploy (images · Helm · schema · policy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Immutable workflow policy and negative mutations
        run: make quality-policy
      - name: Build non-push images
        run: make deploy-images
      - name: Lint, deterministic render, schema and policy
        run: make observability-check deploy-check
      - name: Dependency, secret, image and IaC security gates
        run: make security-scan
