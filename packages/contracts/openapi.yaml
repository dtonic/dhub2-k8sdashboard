  /api/v1/clusters/{clusterId}/events/stream:
    get:
      operationId: streamClusterEvents
      summary: 상태 변경 SSE 스트림 (#12)
      description: >-
        Pod · Workload · Kubernetes Event · Alert 상태 변경을 text/event-stream으로
        내려보냅니다. 각 메시지의 data는 EventEnvelope JSON
        (정본: packages/contracts/schema/stream.schema.json)이며, id는 재연결 시
        Last-Event-ID 헤더로 되돌려 보냅니다. 같은 서버 인스턴스가 보존 중인 구간이면
        놓친 이벤트를 순서대로 재생하고, 인스턴스가 바뀌었거나 보존 구간을 벗어났으면
        kind=reset 이벤트를 보냅니다 — 브라우저는 reset을 받으면 현재 상태를 기존 HTTP
        계약으로 다시 조회해야 합니다. 시계열 Metrics는 이 스트림에 실리지 않습니다
        (ADR 0005). 이 경로는 질의 보호(#11)의 timeout·rate·cache 대상이 아니며,
        대신 전역·주체별 연결 상한을 넘으면 429와 Retry-After로 거절합니다.
        주기적으로 comment(heartbeat)와 retry 힌트가 내려옵니다.
      parameters:
        - $ref: "#/components/parameters/ClusterId"
        - $ref: "#/components/parameters/LastEventID"
      responses:
        "200":
          description: >-
            SSE 스트림. 각 이벤트는 id·event(kind)·data(EventEnvelope JSON) 필드를 갖습니다.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            text/event-stream:
              schema:
                type: string
                description: "data 본문의 정본: packages/contracts/schema/stream.schema.json의 EventEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/StreamCapacity"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-k8s-dashboard
      description: Opaque same-origin HttpOnly browser-session handle; it is not an OIDC token and may outlive the server-side session.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        AUTH_MODE=oidc|mock일 때 필요한 Bearer JWT입니다. AUTH_MODE=none이면 정적 Scope로
        동작합니다. /healthz · /readyz · /version은 어느 모드에서든 인증이 필요 없습니다.
  headers:
    XRequestID:
      description: >-
        요청 상관관계 ID. 인바운드 X-Request-ID가 1..128자의 [A-Za-z0-9._:-]이면 재사용하고,
        아니면 서버가 128bit 난수 소문자 hex를 새로 만듭니다. 에러 본문 requestId와 같은 값입니다.
      schema:
        type: string
        pattern: "^[A-Za-z0-9._:-]{1,128}$"
    DashboardRevisionETag:
      description: Current optimistic-lock revision.
      schema: {type: string, pattern: '^"revision-[1-9][0-9]*"$'}
    DashboardExportETag:
      description: SHA-256 of the canonical exported bytes.
      schema: {type: string, pattern: '^"sha256-[a-f0-9]{64}"$'}
    DashboardContentDisposition:
      description: Safe DSL filename derived from the validated dashboard definition id.
      schema: {type: string, pattern: '^attachment; filename="[a-z][a-z0-9-]{0,63}\.json"$'}
  parameters:
    IfMatchRevision:
      name: If-Match
      in: header
      required: true
      schema: {type: string, pattern: '^"revision-[1-9][0-9]*"$'}
    IfNoneMatchExport:
      name: If-None-Match
      in: header
      required: false
      description: Optional canonical export ETag returned by a previous successful export.
      schema: {type: string, pattern: '^"sha256-[a-f0-9]{64}"$'}
    DashboardListLimit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 50, default: 50}
    DashboardCursor:
      name: cursor
      in: query
      required: false
      description: Opaque, authenticated keyset cursor. It contains no owner or subject text.
      schema: {type: string, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$"}
    ClusterId:
      name: clusterId
      in: path
      required: true
      description: 클러스터 ID. Scope 밖이면 403입니다.
      schema:
        type: string
    Ns:
      name: ns
      in: query
      description: Scope와 교차해 적용할 namespace. 비우거나 all이면 Scope 전체입니다.
      schema:
        type: string
    Range:
      name: range
      in: query
      description: 조회 범위 프리셋 (1h·1d·7d·30d). Step은 서버가 범위에 따라 강제합니다.
      schema:
        type: string
    From:
      name: from
      in: query
      description: Custom 범위 시작. RFC3339 또는 epoch milliseconds 숫자 문자열이며 from/to는 함께 씁니다.
      schema:
        oneOf:
          - type: string
            format: date-time
          - type: string
            pattern: "^-?[0-9]+$"
    To:
      name: to
      in: query
      description: Custom 범위 끝. RFC3339 또는 epoch milliseconds 숫자 문자열입니다.
      schema:
        oneOf:
          - type: string
            format: date-time
          - type: string
            pattern: "^-?[0-9]+$"
    # Resource Explorer (ADR 0018). 경로 세그먼트는 discovery allowlist 대조 전에
    # 형식부터 막습니다 — 임의 문자열이 informer/discovery 키가 되지 않게 합니다.
    ResourceGroup:
      name: group
      in: path
      required: true
      description: API group. core group은 "core"로 표기합니다.
      schema:
        type: string
        maxLength: 253
        pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$"
    ResourceVersion:
      name: version
      in: path
      required: true
      schema:
        type: string
        maxLength: 32
        pattern: "^v[0-9]+((alpha|beta)[0-9]+)?$"
    ResourcePlural:
      name: resource
      in: path
      required: true
      description: 복수형 리소스 이름. subresource는 대상이 아닙니다.
      schema:
        type: string
        maxLength: 63
        pattern: "^[a-z][a-z0-9]*$"
    ResourceNamePrefix:
      name: name
      in: query
      required: false
      description: 이름 prefix 필터.
      schema:
        type: string
        maxLength: 253
    ResourceLabelSelector:
      name: labelSelector
      in: query
      required: false
      description: Kubernetes label selector. 표현식은 최대 8개입니다.
      schema:
        type: string
        maxLength: 512
    ResourceLimit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    ResourceCursor:
      name: cursor
      in: query
      required: false
      description: >-
        opaque keyset cursor. 필터·정렬·Scope가 바뀐 cursor는 400입니다 —
        이어붙이면 중복이나 누락이 조용히 생기기 때문입니다.
      schema: {type: string, maxLength: 512, pattern: "^[A-Za-z0-9_-]+$"}
    ResourceSort:
      name: sort
      in: query
      required: false
      description: 정렬 키. 인덱스가 있는 (namespace, name) 하나뿐입니다.
      schema: {type: string, enum: [name], default: name}
    ResourceOrder:
      name: order
      in: query
      required: false
      schema: {type: string, enum: [asc, desc], default: asc}
    ResourceObjectNamespace:
      name: namespace
      in: query
      required: false
      description: namespaced 리소스에서만 필수입니다. Scope 밖이면 403입니다.
      schema: {type: string, maxLength: 63}
    ResourceObjectName:
      name: name
      in: query
      required: true
      schema: {type: string, minLength: 1, maxLength: 253}
    ResourceObjectUID:
      name: uid
      in: query
      required: true
      description: 목록에서 본 객체의 UID. 다르면 409입니다.
      schema: {type: string, minLength: 1, maxLength: 64}
    ResourceQuery:
      name: q
      in: query
      required: true
      description: >-
        접두사 검색어. 소문자로 정규화되며 name·namespace·kind·label key/value에
        접두사 일치합니다. 1자는 사실상 전체 순회이므로 거절합니다.
      schema: {type: string, minLength: 2, maxLength: 64}
    ResourceSearchLimit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 50, default: 20}
    ResourceSearchCursor:
      name: cursor
      in: query
      required: false
      description: >-
        opaque keyset cursor. 질의어와 Scope에 묶여 있어 둘 중 하나가 바뀌면 400입니다.
        위치 번호가 아니라 값이므로 인덱스가 다시 만들어져도 이어집니다.
      schema: {type: string, maxLength: 1536, pattern: "^[A-Za-z0-9_-]+$"}
    ResourceRecentRefs:
      name: ref
      in: query
      required: false
      explode: true
      style: form
      description: >-
        compact base64url 참조. 반복 지정하며 최대 20개입니다.
        원본 query string 전체는 8192바이트를 넘을 수 없습니다.
      schema:
        type: array
        maxItems: 20
        items: {type: string, minLength: 1, maxLength: 1024, pattern: "^[A-Za-z0-9_-]+$"}
    LastEventID:
      name: Last-Event-ID
      in: header
      required: false
      description: >-
        마지막으로 수신한 SSE id. 브라우저 EventSource가 재연결 시 자동으로 보냅니다.
        서버가 만든 형식(`<hex 인스턴스>-<십진 시퀀스>`, 최대 64자)이 아니면 400입니다.
      schema:
        type: string
        maxLength: 64
        pattern: "^[0-9a-f]{32}-[0-9]{1,20}$"
  requestBodies:
    DashboardDefinitionRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DashboardDefinitionRequest"
  responses:
    DashboardCapabilitiesOK:
      description: Dashboard Builder availability and server-authoritative permissions.
      headers: {X-Request-ID: {$ref: "#/components/headers/XRequestID"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/DashboardCapabilities"}}}
    DashboardDraftOK:
      description: Dashboard draft envelope.
      headers:
        X-Request-ID: {$ref: "#/components/headers/XRequestID"}
        ETag: {$ref: "#/components/headers/DashboardRevisionETag"}
      content: {application/json: {schema: {$ref: "#/components/schemas/DashboardDraft"}}}
    DashboardPageOK:
      description: Bounded keyset page of visible dashboard drafts.
      headers: {X-Request-ID: {$ref: "#/components/headers/XRequestID"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/DashboardDraftPage"}}}
    DashboardCreated:
      description: Dashboard created
      headers:
        X-Request-ID: {$ref: "#/components/headers/XRequestID"}
        ETag: {$ref: "#/components/headers/DashboardRevisionETag"}
      content: {application/json: {schema: {$ref: "#/components/schemas/DashboardDraft"}}}
    DashboardNoContent:
      description: Dashboard deleted
      headers: {X-Request-ID: {$ref: "#/components/headers/XRequestID"}}
    DashboardNotModified:
      description: Export ETag matched
      headers:
        X-Request-ID: {$ref: "#/components/headers/XRequestID"}
        ETag: {$ref: "#/components/headers/DashboardExportETag"}
    DashboardExportOK:
      description: Canonical approved Dashboard DSL JSON with a trailing newline.
      headers:
        X-Request-ID: {$ref: "#/components/headers/XRequestID"}
        ETag: {$ref: "#/components/headers/DashboardExportETag"}
        Content-Disposition: {$ref: "#/components/headers/DashboardContentDisposition"}
      content: {application/json: {schema: {$ref: "#/components/schemas/DashboardDefinition"}}}
    DashboardError:
      description: Dashboard error
      headers: {X-Request-ID: {$ref: "#/components/headers/XRequestID"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/APIError"}}}
    StreamCapacity:
      description: >-
        스트림 연결 상한(전역 또는 주체별) 초과입니다. Retry-After 이후 재시도하세요.
        질의 보호(#11)의 429와 달리 스트림 전용 상한입니다.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        Retry-After:
          description: 재시도까지 대기할 초
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    BadRequest:
      description: 요청이 성립하지 않습니다 (예 invalid_range).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    Unauthorized:
      description: 인증이 필요합니다.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    Forbidden:
      description: 요청한 클러스터·namespace가 Scope 밖입니다. 부분 데이터도 내려가지 않습니다.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    NotFound:
      description: 등록되지 않은 경로입니다.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    MethodNotAllowed:
      description: 허용되지 않은 메서드입니다. Allow 헤더에 허용 메서드가 담깁니다.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        Allow:
          description: 허용 메서드 (전 라우트 GET)
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    InternalError:
      description: 서버 내부 오류입니다. 내부 주소·질의·스택트레이스는 담기지 않습니다.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    ServiceUnavailable:
      description: 스트림 런타임이 준비되지 않았습니다.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    ResourceUnavailable:
      description: >-
        이 배포에는 Resource Explorer가 없거나(central·비활성) 캐시가 아직 동기화
        중입니다. 권한 판정 뒤에 나오는 상태이며, 코드가 resources_unavailable인지
        resource_syncing인지로 구분합니다.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        Retry-After:
          description: 재시도까지 대기할 초(resource_syncing일 때).
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    ResourceUpstream:
      description: >-
        클러스터가 이 리소스를 metadata 전용으로 제공하지 않거나(406) 서버 권한이
        없거나 객체가 응답 한도를 넘었습니다. 내부 주소·질의는 담기지 않습니다.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    ResourceConflict:
      description: 같은 이름의 다른 객체로 교체되었습니다(uid 불일치).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    ResourceRateLimited:
      description: 상세 live GET 전용 rate·동시성 상한 초과입니다.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        Retry-After:
          description: 재시도까지 대기할 초
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    ResourceTimeout:
      description: 클러스터 응답이 상세 조회 timeout을 넘었습니다.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
  schemas:
    DashboardCapabilities:
      type: object
      additionalProperties: false
      required: [enabled, canEdit, canPublish, maxDrafts, maxWidgets]
      properties:
        enabled: {type: boolean}
        canEdit: {type: boolean}
        canPublish: {type: boolean}
        maxDrafts: {type: integer, const: 32}
        maxWidgets: {type: integer, const: 24}
    DashboardDefinitionRequest:
      type: object
      additionalProperties: false
      required: [definition]
      properties:
        definition: {$ref: "#/components/schemas/DashboardDefinition"}
    DashboardDefinition:
      type: object
      additionalProperties: false
      description: >-
        Dashboard DSL v1. Exact type-specific semantics and the Query Catalog allowlist are
        enforced by packages/dashboard-schema/schema/dashboard.schema.json and the shared
        Go/runtime parity corpus. Canonical exported bytes are limited to 65536.
      x-canonical-max-bytes: 65536
      required: [schemaVersion, id, title, variables, widgets]
      properties:
        schemaVersion: {type: integer, const: 1}
        id: {type: string, pattern: "^[a-z][a-z0-9-]{0,63}$"}
        title: {type: string, minLength: 1, maxLength: 160}
        description: {type: string, minLength: 1, maxLength: 160}
        variables:
          type: array
          maxItems: 2
          items:
            type: object
            additionalProperties: false
            required: [id, label, kind]
            properties:
              id: {type: string, pattern: "^[a-z][a-z0-9-]{0,63}$"}
              label: {type: string, minLength: 1, maxLength: 160}
              kind: {type: string, enum: [scope, range]}
        widgets:
          type: array
          minItems: 1
          maxItems: 24
          items:
            type: object
            additionalProperties: false
            required: [id, title, type, binding, layout]
            properties:
              id: {type: string, pattern: "^[a-z][a-z0-9-]{0,63}$"}
              title: {type: string, minLength: 1, maxLength: 160}
              type: {type: string, enum: [TimeSeries, Stat, Gauge, Table, LogStream, EventTimeline]}
              binding: {type: string, enum: [trends, nodes.ready, pods.running, pods.runningPercent, unhealthy, unsupported.logs, events]}
              queryRefs:
                type: array
                minItems: 1
                maxItems: 8
                uniqueItems: true
                items: {type: string, minLength: 1, maxLength: 160}
              options:
                type: object
                additionalProperties: false
                required: [maxRows]
                properties: {maxRows: {type: integer, minimum: 1, maximum: 5000}}
              layout:
                type: object
                additionalProperties: false
                required: [x, y, w, h]
                properties:
                  x: {type: integer, minimum: 0, maximum: 11}
                  y: {type: integer, minimum: 0, maximum: 95}
                  w: {type: integer, minimum: 1, maximum: 12}
                  h: {type: integer, minimum: 1, maximum: 96}
    DashboardDraft:
      type: object
      additionalProperties: false
      required: [id, revision, state, owned, schemaVersion, definition, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        revision: {type: integer, format: int64, minimum: 1}
        state: {type: string, enum: [draft, submitted, approved]}
        owned: {type: boolean}
        schemaVersion: {type: integer, const: 1}
        definition: {$ref: "#/components/schemas/DashboardDefinition"}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    DashboardDraftPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items: {$ref: "#/components/schemas/DashboardDraft"}
        nextCursor: {type: string, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$"}
    APIError:
      type: object
      description: 화면 전체가 실패했을 때만 쓰는 최상위 에러. 섹션 단위 실패는 Section 값입니다.
      required:
        - code
        - message
        - requestId
      properties:
        code:
          type: string
          enum:
            - unauthorized
            - forbidden
            - not_found
            - method_not_allowed
            - upstream_unavailable
            - invalid_range
            - bad_last_event_id
            - stream_capacity
            - internal
            - invalid_dashboard
            - invalid_revision
            - invalid_page
            - invalid_cursor
            - precondition_required
            - revision_conflict
            - draft_limit
            - approved_immutable
            - invalid_state
            - unsupported_media_type
            - body_too_large
            - dashboard_store_unavailable
            - bad_request
            - auth_unavailable
            - refresh_conflict
            - auth_rate_limited
            - session_unavailable
            - cluster_access_denied
            - namespace_access_denied
            - cluster_scope_required
            - resources_unavailable
            - resource_not_allowlisted
            - resource_not_served
            - resource_unsupported
            - resource_forbidden
            - resource_syncing
            - invalid_filter
            - detail_rate_limited
            - uid_mismatch
            - object_too_large
            - upstream_timeout
            - search_unavailable
            - invalid_query
        message:
          type: string
        requestId:
          type: string
          description: 응답 헤더 X-Request-ID와 같은 값
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          const: ok
    ReadyStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          const: syncing
    VersionInfo:
      type: object
      required:
        - version
        - commit
        - buildDate
      properties:
        version:
          type: string
        commit:
          type: string
        buildDate:
          type: string
    # 화면 응답 DTO — 필드 정의의 원본은 packages/contracts/src/index.ts입니다.
    ScopeCluster:
      type: object
      additionalProperties: false
      required: [id, name, namespaces, accessible]
      properties:
        id: {type: string, minLength: 1}
        name: {type: string, minLength: 1}
        namespaces:
          oneOf:
            - {type: string, const: all}
            - type: array
              uniqueItems: true
              items: {type: string, minLength: 1}
        accessible: {type: boolean}
        availableNamespaces:
          type: array
          uniqueItems: true
          items: {type: string, minLength: 1}
    ScopeResponse:
      type: object
      additionalProperties: false
      required: [clusters]
      properties:
        clusters:
          type: array
          items: {$ref: "#/components/schemas/ScopeCluster"}
        canManageWorkloads: {type: boolean}
        canExploreResources: {type: boolean}
      description: "원본: src/index.ts의 ScopeResponse. availableNamespaces는 캐시 기반 표시 힌트"
    # Resource Explorer (ADR 0018) — 조회 전용 계약입니다.
    ResourceState:
      type: string
      description: allowlist 한 항목의 상태. "0건"과 "권한 없음"과 "미지원"을 구분합니다.
      enum: [ready, syncing, unsupported, forbidden, missing]
    ResourceDescriptor:
      type: object
      additionalProperties: false
      required: [group, version, resource, kind, namespaced, verbs, state, count]
      properties:
        group: {type: string, minLength: 1, description: 'core group은 "core"로 표기합니다.'}
        version: {type: string, minLength: 1}
        resource: {type: string, minLength: 1}
        kind: {type: string}
        namespaced: {type: boolean}
        verbs:
          type: array
          uniqueItems: true
          items: {type: string, minLength: 1}
        preferredVersion: {type: string}
        state: {$ref: "#/components/schemas/ResourceState"}
        reason: {type: string}
        count: {type: integer, minimum: 0}
    ResourceCatalogResponse:
      type: object
      additionalProperties: false
      required: [clusterId, generatedAt, degraded, items]
      properties:
        clusterId: {type: string, minLength: 1}
        generatedAt: {type: string, format: date-time}
        refreshedAt: {type: string, format: date-time}
        degraded: {type: boolean}
        reason: {type: string}
        items:
          type: array
          maxItems: 64
          items: {$ref: "#/components/schemas/ResourceDescriptor"}
    ResourceListItem:
      type: object
      additionalProperties: false
      required: [name, uid]
      properties:
        namespace: {type: string}
        name: {type: string, minLength: 1}
        uid: {type: string, minLength: 1}
        createdAt: {type: string, format: date-time}
    ResourceListResponse:
      type: object
      additionalProperties: false
      description: >-
        유계 keyset 페이지입니다. 응답 본문은 1MiB, 행은 200개를 넘지 않습니다.
      x-max-response-bytes: 1048576
      required: [clusterId, group, version, resource, kind, namespaced, generatedAt, appliedScope, items, truncated, total]
      properties:
        clusterId: {type: string, minLength: 1}
        group: {type: string, minLength: 1}
        version: {type: string, minLength: 1}
        resource: {type: string, minLength: 1}
        kind: {type: string}
        namespaced: {type: boolean}
        generatedAt: {type: string, format: date-time}
        observedAt: {type: string, format: date-time}
        appliedScope:
          type: object
          additionalProperties: false
          required: [clusterId, namespaces]
          properties:
            clusterId: {type: string, minLength: 1}
            namespaces:
              oneOf:
                - {type: string, const: all}
                - type: array
                  uniqueItems: true
                  items: {type: string, minLength: 1}
        items:
          type: array
          maxItems: 200
          items: {$ref: "#/components/schemas/ResourceListItem"}
        nextCursor: {type: string, maxLength: 512, pattern: "^[A-Za-z0-9_-]+$"}
        truncated: {type: boolean}
        total: {type: integer, minimum: 0}
    ResourceDetailResponse:
      type: object
      additionalProperties: false
      description: >-
        서버가 정제한 읽기 전용 매니페스트입니다. Secret의 data/stringData는 절대
        포함되지 않으며 managedFields와 민감 annotation도 제거됩니다.
      required: [clusterId, group, version, resource, apiVersion, kind, name, uid, resourceVersion, generatedAt, yaml]
      properties:
        clusterId: {type: string, minLength: 1}
        group: {type: string, minLength: 1}
        version: {type: string, minLength: 1}
        resource: {type: string, minLength: 1}
        apiVersion: {type: string, minLength: 1}
        kind: {type: string, minLength: 1}
        namespace: {type: string}
        name: {type: string, minLength: 1}
        uid: {type: string, minLength: 1}
        resourceVersion: {type: string}
        generatedAt: {type: string, format: date-time}
        yaml: {type: string}
        redacted:
          type: array
          uniqueItems: true
          items: {type: string, minLength: 1}
    # 전역 리소스 검색 (ADR 0023) — 조회 전용 계약입니다.
    AppliedScope:
      type: object
      additionalProperties: false
      description: >-
        서버가 실제로 적용한 Scope입니다. 요청이 보낸 값이 아니라 강제 삽입된 값입니다.
        ResourceListResponse의 인라인 정의와 같은 모양이며, 새 응답이 이 이름을 공유합니다.
      required: [clusterId, namespaces]
      properties:
        clusterId: {type: string, minLength: 1}
        namespaces:
          oneOf:
            - {type: string, const: all}
            - type: array
              uniqueItems: true
              items: {type: string, minLength: 1}
    ResourceMatchField:
      type: string
      description: 결과가 걸린 필드. 색이 아니라 텍스트로 함께 표시합니다.
      enum: [name, namespace, kind, label]
    ResourceSearchItem:
      type: object
      additionalProperties: false
      description: >-
        검색 결과 한 줄입니다. **status는 없습니다** — 검색은 PartialObjectMetadata
        인덱스에서만 읽고 그 안에 status가 없으므로 지어내지 않습니다.
      required: [group, version, resource, kind, namespaced, name, uid, matchedField]
      properties:
        group: {type: string, minLength: 1, description: 'core group은 "core"로 표기합니다.'}
        version: {type: string, minLength: 1}
        resource: {type: string, minLength: 1}
        kind: {type: string}
        namespaced: {type: boolean}
        namespace: {type: string}
        name: {type: string, minLength: 1}
        uid: {type: string, minLength: 1}
        matchedField: {$ref: "#/components/schemas/ResourceMatchField"}
    ResourceSearchResponse:
      type: object
      additionalProperties: false
      description: >-
        유계 keyset 페이지입니다. 응답 본문은 256KiB, 행은 50개를 넘지 않습니다.
        Scope 밖 객체는 truncated·nextCursor 어디에도 영향을 주지 않습니다.
      x-max-response-bytes: 262144
      required: [clusterId, query, generatedAt, appliedScope, items, truncated, degraded]
      properties:
        clusterId: {type: string, minLength: 1}
        query: {type: string, minLength: 2, maxLength: 64}
        generatedAt: {type: string, format: date-time}
        observedAt: {type: string, format: date-time}
        appliedScope: {$ref: "#/components/schemas/AppliedScope"}
        items:
          type: array
          maxItems: 50
          items: {$ref: "#/components/schemas/ResourceSearchItem"}
        nextCursor: {type: string, maxLength: 1536, pattern: "^[A-Za-z0-9_-]+$"}
        truncated: {type: boolean}
        degraded:
          type: boolean
          description: >-
            일부 리소스가 색인 예산으로 검색에서 빠졌거나 label 색인이 잘렸다는 뜻입니다.
            잘린 검색을 완전한 검색인 것처럼 보여주지 않기 위한 신호입니다.
        reason: {type: string}
    ResourceRecentItem:
      type: object
      additionalProperties: false
      required: [group, version, resource, kind, namespaced, name, uid]
      properties:
        group: {type: string, minLength: 1}
        version: {type: string, minLength: 1}
        resource: {type: string, minLength: 1}
        kind: {type: string}
        namespaced: {type: boolean}
        namespace: {type: string}
        name: {type: string, minLength: 1}
        uid: {type: string, minLength: 1}
    ResourceRecentResponse:
      type: object
      additionalProperties: false
      description: >-
        재해석된 최근 항목입니다. 요청 순서를 그대로 지키며, 해석되지 않은 참조는
        오류가 아니라 목록에서 빠지는 것으로 표현합니다.
      required: [clusterId, generatedAt, appliedScope, items]
      properties:
        clusterId: {type: string, minLength: 1}
        generatedAt: {type: string, format: date-time}
        appliedScope: {$ref: "#/components/schemas/AppliedScope"}
        items:
          type: array
          maxItems: 20
          items: {$ref: "#/components/schemas/ResourceRecentItem"}
    AuthSessionResponse:
      oneOf:
        - type: object
          additionalProperties: false
          required: [authenticated]
          properties:
            authenticated: {type: boolean, const: false}
        - type: object
          additionalProperties: false
          required: [authenticated, refreshable, csrfToken]
          properties:
            authenticated: {type: boolean, const: false}
            refreshable: {type: boolean, const: true}
            csrfToken: {type: string, minLength: 43, maxLength: 43, pattern: "^[A-Za-z0-9_-]{43}$"}
        - type: object
          additionalProperties: false
          required: [authenticated, principal, capabilities, expiresAt, refreshAt, csrfToken]
          properties:
            authenticated: {type: boolean, const: true}
            principal:
              type: object
              additionalProperties: false
              required: [displayName]
              properties: {displayName: {type: string, minLength: 1, maxLength: 128}}
            capabilities:
              type: object
              additionalProperties: false
              required: [canEditDashboard, canPublishDashboard]
              properties:
                canEditDashboard: {type: boolean}
                canPublishDashboard: {type: boolean}
            expiresAt: {type: string, format: date-time}
            refreshAt: {type: string, format: date-time}
            csrfToken: {type: string, minLength: 43, maxLength: 43, pattern: "^[A-Za-z0-9_-]{43}$"}
      description: "원본: src/index.ts의 AuthSessionResponse. OIDC token과 raw role/subject는 포함하지 않음"
