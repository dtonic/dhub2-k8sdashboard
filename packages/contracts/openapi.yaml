# Observability API/BFF — 등록된 전체 HTTP method/path 라우트 계약입니다. (#5, #24)
#
# 유지 규칙:
#   - 라우터(apps/api/internal/httpapi/server.go)와 이 문서의 메서드·경로가 어긋나면
#     apps/api의 TestOpenAPIMatchesRouter가 실패합니다. 라우트를 바꾸면 여기도 고칩니다.
#   - 화면 응답 DTO의 원본은 packages/contracts/src/index.ts입니다. 일반 화면 모델은 이름만
#     참조하고, 인증·Scope처럼 경계 검증이 필요한 모델만 구체 스키마를 유지합니다.
#   - 모든 응답은 X-Request-ID 헤더를 달고, 에러 본문 requestId와 같은 값입니다.
openapi: 3.1.0
info:
  title: k8s-dashboard Observability API
  description: >-
    Kubernetes 운영 흐름에 특화된 화면 단위 조회 API입니다. 화면 하나 = 요청 하나(ADR 0002),
    Scope는 서버가 강제합니다(README §10). 부분 장애는 HTTP 에러가 아니라 Section 값입니다.
  version: 0.5.0
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/v1/auth/login:
    get:
      operationId: beginBrowserLogin
      description: Starts a bounded one-time login transaction and sets an HttpOnly __Host- login cookie; no OIDC token is returned to the browser.
      security: []
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Bounded relative Web UI route only; API, operational, absolute, encoded, and unknown paths are rejected.
          schema: {type: string, maxLength: 2048, pattern: "^/"}
      responses:
        "302": {description: Redirect to OIDC authorization endpoint, headers: {X-Request-ID: {$ref: "#/components/headers/XRequestID"}, Location: {schema: {type: string}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "429": {$ref: "#/components/responses/DashboardError"}
        "503": {$ref: "#/components/responses/DashboardError"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
  /api/v1/auth/callback:
    get:
      operationId: completeBrowserLogin
      description: Requires the matching one-time HttpOnly login cookie and state, rotates the browser session SID, and redirects without exposing OIDC tokens.
      security: []
      parameters:
        - {name: code, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 2048}}
        - {name: state, in: query, required: true, schema: {type: string, minLength: 43, maxLength: 43}}
      responses:
        "303": {description: Safe same-origin return redirect, headers: {X-Request-ID: {$ref: "#/components/headers/XRequestID"}, Location: {schema: {type: string}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "429": {$ref: "#/components/responses/DashboardError"}
        "503": {$ref: "#/components/responses/DashboardError"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
  /api/v1/auth/session:
    get:
      operationId: getBrowserSession
      description: The browser session cookie is optional; an absent, unknown, or expired session returns authenticated false without exposing the cookie or token.
      security: []
      responses:
        "200": {description: Bounded browser auth status without OIDC tokens, headers: {X-Request-ID: {$ref: "#/components/headers/XRequestID"}}, content: {application/json: {schema: {$ref: "#/components/schemas/AuthSessionResponse"}}}}
        "429": {$ref: "#/components/responses/DashboardError"}
        "503": {$ref: "#/components/responses/DashboardError"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
  /api/v1/auth/refresh:
    post:
      operationId: refreshBrowserSession
      security:
        - cookieAuth: []
      parameters:
        - {name: Origin, in: header, required: true, description: Must exactly match the configured HTTPS public origin., schema: {type: string, format: uri, maxLength: 2048}}
        - {name: X-CSRF-Token, in: header, required: true, schema: {type: string, minLength: 43, maxLength: 43, pattern: "^[A-Za-z0-9_-]{43}$"}}
      responses:
        "204":
          description: Browser session refreshed with a rotated CSRF generation
          headers:
            X-Request-ID: {$ref: "#/components/headers/XRequestID"}
            X-CSRF-Token:
              required: true
              schema: {type: string, minLength: 43, maxLength: 43, pattern: "^[A-Za-z0-9_-]{43}$"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/DashboardError"}
        "429": {$ref: "#/components/responses/DashboardError"}
        "503": {$ref: "#/components/responses/DashboardError"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
  /api/v1/auth/logout:
    post:
      operationId: logoutBrowserSession
      security:
        - cookieAuth: []
      parameters:
        - {name: Origin, in: header, required: true, description: Must exactly match the configured HTTPS public origin., schema: {type: string, format: uri, maxLength: 2048}}
        - {name: X-CSRF-Token, in: header, required: true, schema: {type: string, minLength: 43, maxLength: 43, pattern: "^[A-Za-z0-9_-]{43}$"}}
      responses:
        "204": {$ref: "#/components/responses/DashboardNoContent"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/DashboardError"}
        "503": {$ref: "#/components/responses/DashboardError"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
  /api/v1/dashboard-capabilities:
    get:
      operationId: getDashboardCapabilities
      responses:
        "200": {$ref: "#/components/responses/DashboardCapabilitiesOK"}
        "401": {$ref: "#/components/responses/DashboardError"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
  /api/v1/dashboard-drafts:
    get:
      operationId: listDashboardDrafts
      parameters:
        - {$ref: "#/components/parameters/DashboardListLimit"}
        - {$ref: "#/components/parameters/DashboardCursor"}
      responses:
        "200": {$ref: "#/components/responses/DashboardPageOK"}
        "400": {$ref: "#/components/responses/DashboardError"}
        "401": {$ref: "#/components/responses/DashboardError"}
        "403": {$ref: "#/components/responses/DashboardError"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "500": {$ref: "#/components/responses/DashboardError"}
        "503": {$ref: "#/components/responses/DashboardError"}
    post:
      operationId: createDashboardDraft
      requestBody: {$ref: "#/components/requestBodies/DashboardDefinitionRequest"}
      responses:
        "201": {$ref: "#/components/responses/DashboardCreated"}
        "400": {$ref: "#/components/responses/DashboardError"}
        "401": {$ref: "#/components/responses/DashboardError"}
        "403": {$ref: "#/components/responses/DashboardError"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "409": {$ref: "#/components/responses/DashboardError"}
        "413": {$ref: "#/components/responses/DashboardError"}
        "415": {$ref: "#/components/responses/DashboardError"}
        "503": {$ref: "#/components/responses/DashboardError"}
  /api/v1/dashboard-drafts/import:
    post:
      operationId: importDashboardDraft
      description: Export한 canonical 정의 JSON을 업로드해 요청자 소유 draft로 생성합니다. (ADR 0016)
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        "201": {$ref: "#/components/responses/DashboardCreated"}
        "400": {$ref: "#/components/responses/DashboardError"}
        "401": {$ref: "#/components/responses/DashboardError"}
        "403": {$ref: "#/components/responses/DashboardError"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "409": {$ref: "#/components/responses/DashboardError"}
        "413": {$ref: "#/components/responses/DashboardError"}
        "415": {$ref: "#/components/responses/DashboardError"}
        "503": {$ref: "#/components/responses/DashboardError"}
  /api/v1/dashboard-drafts/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getDashboardDraft
      responses:
        "200": {$ref: "#/components/responses/DashboardDraftOK"}
        "401": {$ref: "#/components/responses/DashboardError"}
        "403": {$ref: "#/components/responses/DashboardError"}
        "404": {$ref: "#/components/responses/DashboardError"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "500": {$ref: "#/components/responses/DashboardError"}
        "503": {$ref: "#/components/responses/DashboardError"}
    put:
      operationId: updateDashboardDraft
      parameters: [{$ref: "#/components/parameters/IfMatchRevision"}]
      requestBody: {$ref: "#/components/requestBodies/DashboardDefinitionRequest"}
      responses:
        "200": {$ref: "#/components/responses/DashboardDraftOK"}
        "400": {$ref: "#/components/responses/DashboardError"}
        "401": {$ref: "#/components/responses/DashboardError"}
        "403": {$ref: "#/components/responses/DashboardError"}
        "404": {$ref: "#/components/responses/DashboardError"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "409": {$ref: "#/components/responses/DashboardError"}
        "413": {$ref: "#/components/responses/DashboardError"}
        "415": {$ref: "#/components/responses/DashboardError"}
        "428": {$ref: "#/components/responses/DashboardError"}
        "503": {$ref: "#/components/responses/DashboardError"}
    delete:
      operationId: deleteDashboardDraft
      parameters: [{$ref: "#/components/parameters/IfMatchRevision"}]
      responses:
        "204": {$ref: "#/components/responses/DashboardNoContent"}
        "400": {$ref: "#/components/responses/DashboardError"}
        "401": {$ref: "#/components/responses/DashboardError"}
        "403": {$ref: "#/components/responses/DashboardError"}
        "404": {$ref: "#/components/responses/DashboardError"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "409": {$ref: "#/components/responses/DashboardError"}
        "428": {$ref: "#/components/responses/DashboardError"}
        "503": {$ref: "#/components/responses/DashboardError"}
  /api/v1/dashboard-drafts/{id}/submit:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      - {$ref: "#/components/parameters/IfMatchRevision"}
    post:
      operationId: submitDashboardDraft
      responses:
        "200": {$ref: "#/components/responses/DashboardDraftOK"}
        "400": {$ref: "#/components/responses/DashboardError"}
        "401": {$ref: "#/components/responses/DashboardError"}
        "403": {$ref: "#/components/responses/DashboardError"}
        "404": {$ref: "#/components/responses/DashboardError"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "409": {$ref: "#/components/responses/DashboardError"}
        "428": {$ref: "#/components/responses/DashboardError"}
        "500": {$ref: "#/components/responses/DashboardError"}
        "503": {$ref: "#/components/responses/DashboardError"}
  /api/v1/dashboard-drafts/{id}/approve:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      - {$ref: "#/components/parameters/IfMatchRevision"}
    post:
      operationId: approveDashboardDraft
      responses:
        "200": {$ref: "#/components/responses/DashboardDraftOK"}
        "400": {$ref: "#/components/responses/DashboardError"}
        "401": {$ref: "#/components/responses/DashboardError"}
        "403": {$ref: "#/components/responses/DashboardError"}
        "404": {$ref: "#/components/responses/DashboardError"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "409": {$ref: "#/components/responses/DashboardError"}
        "428": {$ref: "#/components/responses/DashboardError"}
        "500": {$ref: "#/components/responses/DashboardError"}
        "503": {$ref: "#/components/responses/DashboardError"}
  /api/v1/dashboard-drafts/{id}/clone:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: cloneDashboardDraft
      responses:
        "200": {$ref: "#/components/responses/DashboardDraftOK"}
        "401": {$ref: "#/components/responses/DashboardError"}
        "403": {$ref: "#/components/responses/DashboardError"}
        "404": {$ref: "#/components/responses/DashboardError"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "409": {$ref: "#/components/responses/DashboardError"}
        "500": {$ref: "#/components/responses/DashboardError"}
        "503": {$ref: "#/components/responses/DashboardError"}
  /api/v1/dashboard-drafts/{id}/export:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: exportDashboard
      parameters: [{$ref: "#/components/parameters/IfNoneMatchExport"}]
      responses:
        "200": {$ref: "#/components/responses/DashboardExportOK"}
        "304": {$ref: "#/components/responses/DashboardNotModified"}
        "401": {$ref: "#/components/responses/DashboardError"}
        "403": {$ref: "#/components/responses/DashboardError"}
        "404": {$ref: "#/components/responses/DashboardError"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "500": {$ref: "#/components/responses/DashboardError"}
        "503": {$ref: "#/components/responses/DashboardError"}
  /healthz:
    get:
      operationId: getHealthz
      summary: 프로세스 생존 확인
      description: 인증 없이 호출 가능한 운영 경로입니다.
      security: []
      responses:
        "200":
          description: 프로세스가 살아 있습니다.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: getReadyz
      summary: 트래픽 수용 준비 확인
      description: >-
        informer 캐시 최초 동기화가 끝난 뒤에만 200입니다. 동기화 전 트래픽은
        "Pod 0개"를 정상처럼 보이게 하므로 503으로 거절합니다. 인증 없이 호출 가능합니다.
      security: []
      responses:
        "200":
          description: 준비되었습니다.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: informer 캐시 동기화 중입니다.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"
  /version:
    get:
      operationId: getVersion
      summary: 빌드 버전 정보
      description: >-
        빌드 시 ldflags로 주입된 버전·커밋·빌드 시각입니다. 로컬 빌드 기본값은
        dev/unknown입니다. 인증 없이 호출 가능합니다.
      security: []
      responses:
        "200":
          description: 빌드 정보입니다.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"
  /metrics:
    get:
      operationId: getMetrics
      summary: Prometheus platform, datasource, cache, query protection, informer and SSE metrics
      description: Fixed-label HTTP RED, logical upstream outcome/latency/circuit, cache/query protection, informer sync, and SSE metrics. Authentication and query guards are not applied; deployments keep this endpoint off the public Ingress and allow only the monitoring scrape boundary.
      security: []
      responses:
        "200":
          description: Prometheus text exposition.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            text/plain:
              schema:
                type: string
  /api/v1/scope:
    get:
      operationId: getScope
      summary: 사용자가 접근 가능한 클러스터·네임스페이스 범위
      responses:
        "200":
          description: "ScopeResponse — 원본: packages/contracts/src/index.ts"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/clusters/{clusterId}/overview:
    get:
      operationId: getClusterOverview
      summary: Cluster Overview 화면 집계
      parameters:
        - $ref: "#/components/parameters/ClusterId"
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: namespace
          in: query
          description: Scope와 교차해 적용할 namespace. 비우거나 all이면 Scope 전체입니다.
          schema:
            type: string
      responses:
        "200":
          description: "ClusterOverviewResponse — 원본: packages/contracts/src/index.ts"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterOverviewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/clusters/{clusterId}/nodes:
    get:
      operationId: listNodes
      summary: Nodes 화면 집계 — 노드 목록·용량 대비 요청량·노드별 Pod
      parameters:
        - $ref: "#/components/parameters/ClusterId"
      responses:
        "200":
          description: "NodeListResponse — 원본: packages/contracts/src/index.ts. 노드는 클러스터 스코프이므로 namespace 제한 사용자는 forbidden 섹션을 받습니다."
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/clusters/{clusterId}/namespaces:
    get:
      operationId: listNamespaces
      summary: Namespace 목록 화면 집계
      parameters:
        - $ref: "#/components/parameters/ClusterId"
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: "NamespaceListResponse — 원본: packages/contracts/src/index.ts"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NamespaceListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/clusters/{clusterId}/namespaces/{namespace}:
    get:
      operationId: getNamespaceDetail
      summary: Namespace Drill-down 화면 집계
      parameters:
        - $ref: "#/components/parameters/ClusterId"
        - name: namespace
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: "NamespaceDetailResponse — 원본: packages/contracts/src/index.ts"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NamespaceDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/clusters/{clusterId}/workloads/{kind}/{name}:
    get:
      operationId: getWorkloadDetail
      summary: Workload Drill-down 화면 집계
      parameters:
        - $ref: "#/components/parameters/ClusterId"
        - name: kind
          in: path
          required: true
          description: Deployment · StatefulSet · DaemonSet · ReplicaSet · CronJob
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Ns"
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: "WorkloadDetailResponse — 원본: packages/contracts/src/index.ts"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkloadDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/clusters/{clusterId}/pods/{name}:
    get:
      operationId: getPodDetail
      summary: Pod Drill-down 화면 집계
      parameters:
        - $ref: "#/components/parameters/ClusterId"
        - name: name
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Ns"
        - name: uid
