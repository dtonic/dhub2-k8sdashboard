    get:
      operationId: searchClusterResources
      summary: "Scope 안 전역 리소스 검색 (metadata 접두사 인덱스, ADR 0023)"
      description: >-
        allowlist GVR의 metadata 인덱스 위에서만 도는 조회 전용 접두사 검색입니다.
        name·namespace·kind·정규화된 label key/value의 **접두사만** 일치하며 regex와
        fuzzy는 없습니다. Scope는 후보 순회 **전에** 적용되어, 권한 밖 namespace의
        객체는 검사되지도 않고 truncated·cursor에도 영향을 주지 않습니다. namespace
        파라미터가 없는 것이 계약입니다 — 범위는 언제나 "이 사용자가 볼 수 있는 전부"입니다.
        결과에 status는 없습니다(PartialObjectMetadata에 status가 없습니다).
        일부 리소스가 색인 예산으로 빠지거나 label 색인이 잘리면 degraded가 참이 됩니다.
