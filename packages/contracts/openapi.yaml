        - $ref: "#/components/parameters/ClusterId"
        - $ref: "#/components/parameters/ResourceQuery"
        - $ref: "#/components/parameters/ResourceSearchLimit"
        - $ref: "#/components/parameters/ResourceSearchCursor"
