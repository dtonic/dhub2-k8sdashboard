      description: >-
        시작 시점과 주기적 discovery로 만든 불변 snapshot입니다. 요청 처리 중에는
        discovery도 Kubernetes LIST도 호출하지 않습니다. 각 항목의 state가
        ready·syncing·unsupported·forbidden·missing을 구분합니다.
