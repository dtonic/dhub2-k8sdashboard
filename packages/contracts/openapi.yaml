    get:
      operationId: resolveRecentClusterResources
      summary: "브라우저가 보관한 최근 항목 참조를 서버가 다시 확인 (ADR 0023)"
      description: >-
        브라우저는 UID와 이동 경로만 보관하고 표시할 제목은 매번 서버가 다시 정합니다.
        해석은 로컬 metadata 인덱스에서만 이뤄지며 Kubernetes 호출은 0회입니다.
        참조는 compact base64url 문자열이고 최대 20개, 참조 하나는 1024자, 원본
        query string 전체는 8KiB를 넘을 수 없습니다. 웹 클라이언트는 이보다 낮은
        6KiB에서 요청을 나눠 보내고 하나의 취소 신호를 공유하며 입력 순서대로 합칩니다.
        크기·구조 위반은 400이고, 삭제·권한 상실·UID 교체로 **해석되지 않는 참조는
        오류가 아니라 응답에서 빠집니다.** 응답 순서는 요청 순서 그대로입니다.
