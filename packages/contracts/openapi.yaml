# Observability API/BFF — 등록된 전체 HTTP method/path 라우트 계약입니다. (#5, #24)
#
# 유지 규칙:
#   - 라우터(apps/api/internal/httpapi/server.go)와 이 문서의 메서드·경로가 어긋나면
#     apps/api의 TestOpenAPIMatchesRouter가 실패합니다. 라우트를 바꾸면 여기도 고칩니다.
#   - 화면 응답 DTO의 원본은 packages/contracts/src/index.ts입니다. 여기서는 전체 모델을
#     복제하지 않고 이름만 참조합니다 — 두 곳에서 필드를 관리하지 않기 위해서입니다.
#   - 모든 응답은 X-Request-ID 헤더를 달고, 에러 본문 requestId와 같은 값입니다.
openapi: 3.1.0
info:
  title: k8s-dashboard Observability API
  description: >-
    Kubernetes 운영 흐름에 특화된 화면 단위 조회 API입니다. 화면 하나 = 요청 하나(ADR 0002),
    Scope는 서버가 강제합니다(README §10). 부분 장애는 HTTP 에러가 아니라 Section 값입니다.
  version: 0.5.0
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/v1/dashboard-capabilities:
    get:
      operationId: getDashboardCapabilities
      responses:
        "200": {$ref: "#/components/responses/DashboardCapabilitiesOK"}
        "401": {$ref: "#/components/responses/DashboardError"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
  /api/v1/dashboard-drafts:
    get:
      operationId: listDashboardDrafts
      parameters:
        - {$ref: "#/components/parameters/DashboardListLimit"}
        - {$ref: "#/components/parameters/DashboardCursor"}
      responses:
        "200": {$ref: "#/components/responses/DashboardPageOK"}
        "400": {$ref: "#/components/responses/DashboardError"}
        "401": {$ref: "#/components/responses/DashboardError"}
        "403": {$ref: "#/components/responses/DashboardError"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "500": {$ref: "#/components/responses/DashboardError"}
        "503": {$ref: "#/components/responses/DashboardError"}
    post:
      operationId: createDashboardDraft
      requestBody: {$ref: "#/components/requestBodies/DashboardDefinitionRequest"}
      responses:
        "201": {$ref: "#/components/responses/DashboardCreated"}
        "400": {$ref: "#/components/responses/DashboardError"}
        "401": {$ref: "#/components/responses/DashboardError"}
        "403": {$ref: "#/components/responses/DashboardError"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "409": {$ref: "#/components/responses/DashboardError"}
        "413": {$ref: "#/components/responses/DashboardError"}
        "415": {$ref: "#/components/responses/DashboardError"}
        "503": {$ref: "#/components/responses/DashboardError"}
  /api/v1/dashboard-drafts/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getDashboardDraft
      responses:
        "200": {$ref: "#/components/responses/DashboardDraftOK"}
        "401": {$ref: "#/components/responses/DashboardError"}
        "403": {$ref: "#/components/responses/DashboardError"}
        "404": {$ref: "#/components/responses/DashboardError"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "500": {$ref: "#/components/responses/DashboardError"}
        "503": {$ref: "#/components/responses/DashboardError"}
    put:
      operationId: updateDashboardDraft
      parameters: [{$ref: "#/components/parameters/IfMatchRevision"}]
      requestBody: {$ref: "#/components/requestBodies/DashboardDefinitionRequest"}
      responses:
        "200": {$ref: "#/components/responses/DashboardDraftOK"}
        "400": {$ref: "#/components/responses/DashboardError"}
        "401": {$ref: "#/components/responses/DashboardError"}
        "403": {$ref: "#/components/responses/DashboardError"}
        "404": {$ref: "#/components/responses/DashboardError"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "409": {$ref: "#/components/responses/DashboardError"}
        "413": {$ref: "#/components/responses/DashboardError"}
        "415": {$ref: "#/components/responses/DashboardError"}
        "428": {$ref: "#/components/responses/DashboardError"}
        "503": {$ref: "#/components/responses/DashboardError"}
    delete:
      operationId: deleteDashboardDraft
      parameters: [{$ref: "#/components/parameters/IfMatchRevision"}]
      responses:
        "204": {$ref: "#/components/responses/DashboardNoContent"}
        "400": {$ref: "#/components/responses/DashboardError"}
        "401": {$ref: "#/components/responses/DashboardError"}
        "403": {$ref: "#/components/responses/DashboardError"}
        "404": {$ref: "#/components/responses/DashboardError"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "409": {$ref: "#/components/responses/DashboardError"}
        "428": {$ref: "#/components/responses/DashboardError"}
        "503": {$ref: "#/components/responses/DashboardError"}
  /api/v1/dashboard-drafts/{id}/submit:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      - {$ref: "#/components/parameters/IfMatchRevision"}
    post:
      operationId: submitDashboardDraft
      responses:
        "200": {$ref: "#/components/responses/DashboardDraftOK"}
        "400": {$ref: "#/components/responses/DashboardError"}
        "401": {$ref: "#/components/responses/DashboardError"}
        "403": {$ref: "#/components/responses/DashboardError"}
        "404": {$ref: "#/components/responses/DashboardError"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "409": {$ref: "#/components/responses/DashboardError"}
        "428": {$ref: "#/components/responses/DashboardError"}
        "500": {$ref: "#/components/responses/DashboardError"}
        "503": {$ref: "#/components/responses/DashboardError"}
  /api/v1/dashboard-drafts/{id}/approve:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      - {$ref: "#/components/parameters/IfMatchRevision"}
    post:
      operationId: approveDashboardDraft
      responses:
        "200": {$ref: "#/components/responses/DashboardDraftOK"}
        "400": {$ref: "#/components/responses/DashboardError"}
        "401": {$ref: "#/components/responses/DashboardError"}
        "403": {$ref: "#/components/responses/DashboardError"}
        "404": {$ref: "#/components/responses/DashboardError"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "409": {$ref: "#/components/responses/DashboardError"}
        "428": {$ref: "#/components/responses/DashboardError"}
        "500": {$ref: "#/components/responses/DashboardError"}
        "503": {$ref: "#/components/responses/DashboardError"}
  /api/v1/dashboard-drafts/{id}/clone:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: cloneDashboardDraft
      responses:
        "200": {$ref: "#/components/responses/DashboardDraftOK"}
        "401": {$ref: "#/components/responses/DashboardError"}
        "403": {$ref: "#/components/responses/DashboardError"}
        "404": {$ref: "#/components/responses/DashboardError"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "409": {$ref: "#/components/responses/DashboardError"}
        "500": {$ref: "#/components/responses/DashboardError"}
        "503": {$ref: "#/components/responses/DashboardError"}
  /api/v1/dashboard-drafts/{id}/export:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: exportDashboard
      parameters: [{$ref: "#/components/parameters/IfNoneMatchExport"}]
      responses:
        "200": {$ref: "#/components/responses/DashboardExportOK"}
        "304": {$ref: "#/components/responses/DashboardNotModified"}
        "401": {$ref: "#/components/responses/DashboardError"}
        "403": {$ref: "#/components/responses/DashboardError"}
        "404": {$ref: "#/components/responses/DashboardError"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "500": {$ref: "#/components/responses/DashboardError"}
        "503": {$ref: "#/components/responses/DashboardError"}
  /healthz:
    get:
      operationId: getHealthz
      summary: 프로세스 생존 확인
      description: 인증 없이 호출 가능한 운영 경로입니다.
      security: []
      responses:
        "200":
          description: 프로세스가 살아 있습니다.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: getReadyz
      summary: 트래픽 수용 준비 확인
      description: >-
        informer 캐시 최초 동기화가 끝난 뒤에만 200입니다. 동기화 전 트래픽은
        "Pod 0개"를 정상처럼 보이게 하므로 503으로 거절합니다. 인증 없이 호출 가능합니다.
      security: []
      responses:
        "200":
          description: 준비되었습니다.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: informer 캐시 동기화 중입니다.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"
  /version:
    get:
      operationId: getVersion
      summary: 빌드 버전 정보
      description: >-
        빌드 시 ldflags로 주입된 버전·커밋·빌드 시각입니다. 로컬 빌드 기본값은
        dev/unknown입니다. 인증 없이 호출 가능합니다.
      security: []
      responses:
        "200":
          description: 빌드 정보입니다.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"
  /metrics:
    get:
      operationId: getMetrics
      summary: Prometheus platform, datasource, cache, query protection, informer and SSE metrics
      description: Fixed-label HTTP RED, logical upstream outcome/latency/circuit, cache/query protection, informer sync, and SSE metrics. Authentication and query guards are not applied; deployments keep this endpoint off the public Ingress and allow only the monitoring scrape boundary.
      security: []
      responses:
        "200":
          description: Prometheus text exposition.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            text/plain:
              schema:
                type: string
  /api/v1/scope:
    get:
      operationId: getScope
      summary: 사용자가 접근 가능한 클러스터·네임스페이스 범위
      responses:
        "200":
          description: "ScopeResponse — 원본: packages/contracts/src/index.ts"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/clusters/{clusterId}/overview:
    get:
      operationId: getClusterOverview
      summary: Cluster Overview 화면 집계
      parameters:
        - $ref: "#/components/parameters/ClusterId"
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: namespace
          in: query
          description: Scope와 교차해 적용할 namespace. 비우거나 all이면 Scope 전체입니다.
          schema:
            type: string
      responses:
        "200":
          description: "ClusterOverviewResponse — 원본: packages/contracts/src/index.ts"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterOverviewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/clusters/{clusterId}/namespaces:
    get:
      operationId: listNamespaces
      summary: Namespace 목록 화면 집계
      parameters:
        - $ref: "#/components/parameters/ClusterId"
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: "NamespaceListResponse — 원본: packages/contracts/src/index.ts"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NamespaceListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/clusters/{clusterId}/namespaces/{namespace}:
    get:
      operationId: getNamespaceDetail
      summary: Namespace Drill-down 화면 집계
      parameters:
        - $ref: "#/components/parameters/ClusterId"
        - name: namespace
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: "NamespaceDetailResponse — 원본: packages/contracts/src/index.ts"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NamespaceDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/clusters/{clusterId}/workloads/{kind}/{name}:
    get:
      operationId: getWorkloadDetail
      summary: Workload Drill-down 화면 집계
      parameters:
        - $ref: "#/components/parameters/ClusterId"
        - name: kind
          in: path
          required: true
          description: Deployment · StatefulSet · DaemonSet · ReplicaSet · CronJob
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Ns"
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: "WorkloadDetailResponse — 원본: packages/contracts/src/index.ts"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkloadDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/clusters/{clusterId}/pods/{name}:
    get:
      operationId: getPodDetail
      summary: Pod Drill-down 화면 집계
      parameters:
        - $ref: "#/components/parameters/ClusterId"
        - name: name
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Ns"
        - name: uid
          in: query
          description: Pod UID. 이름 재사용에 안전하도록 이름보다 UID를 우선합니다. (README §5)
          schema:
            type: string
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: "PodDetailResponse — 원본: packages/contracts/src/index.ts"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/clusters/{clusterId}/logs:
    get:
      operationId: searchLogs
      summary: Logs Explorer 화면 집계
      description: Cursor/Search-after 페이징만 지원합니다. offset 페이징은 없습니다. (ADR 0003)
      parameters:
        - $ref: "#/components/parameters/ClusterId"
        - $ref: "#/components/parameters/Ns"
        - name: workload
          in: query
          schema:
            type: string
        - name: podUid
          in: query
          schema:
            type: string
        - name: container
          in: query
          schema:
            type: string
        - name: levels
          in: query
          description: 쉼표로 구분한 로그 레벨 (ERROR,WARN,INFO,DEBUG). 모르는 값은 무시합니다.
          schema:
            type: string
        - name: q
          in: query
          description: 본문 검색어
          schema:
            type: string
        - name: cursor
          in: query
          description: 이전 응답 cursor.next 값
          schema:
            type: string
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: "LogSearchResponse — 원본: packages/contracts/src/index.ts"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogSearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/clusters/{clusterId}/topology:
    get:
      operationId: getTopology
      summary: Pod Topology 화면 집계
      parameters:
        - $ref: "#/components/parameters/ClusterId"
        - $ref: "#/components/parameters/Ns"
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: "TopologyResponse — 원본: packages/contracts/src/index.ts"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopologyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/clusters/{clusterId}/topology/edges/{edgeId}/series:
    get:
      operationId: getTopologyEdgeSeries
      summary: Topology Edge 시계열
      parameters:
        - $ref: "#/components/parameters/ClusterId"
        - name: edgeId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Ns"
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: "TopologyEdgeSeriesResponse — 원본: packages/contracts/src/index.ts"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopologyEdgeSeriesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/clusters/{clusterId}/alerts:
    get:
      operationId: listAlerts
      summary: Alerts 화면 집계 (조회 전용)
      parameters:
        - $ref: "#/components/parameters/ClusterId"
        - $ref: "#/components/parameters/Ns"
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: "AlertListResponse — 원본: packages/contracts/src/index.ts"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/clusters/{clusterId}/events/stream:
    get:
      operationId: streamClusterEvents
      summary: 상태 변경 SSE 스트림 (#12)
      description: >-
        Pod · Workload · Kubernetes Event · Alert 상태 변경을 text/event-stream으로
        내려보냅니다. 각 메시지의 data는 EventEnvelope JSON
        (정본: packages/contracts/schema/stream.schema.json)이며, id는 재연결 시
        Last-Event-ID 헤더로 되돌려 보냅니다. 같은 서버 인스턴스가 보존 중인 구간이면
        놓친 이벤트를 순서대로 재생하고, 인스턴스가 바뀌었거나 보존 구간을 벗어났으면
        kind=reset 이벤트를 보냅니다 — 브라우저는 reset을 받으면 현재 상태를 기존 HTTP
        계약으로 다시 조회해야 합니다. 시계열 Metrics는 이 스트림에 실리지 않습니다
        (ADR 0005). 이 경로는 질의 보호(#11)의 timeout·rate·cache 대상이 아니며,
        대신 전역·주체별 연결 상한을 넘으면 429와 Retry-After로 거절합니다.
        주기적으로 comment(heartbeat)와 retry 힌트가 내려옵니다.
      parameters:
        - $ref: "#/components/parameters/ClusterId"
        - $ref: "#/components/parameters/LastEventID"
      responses:
        "200":
          description: >-
            SSE 스트림. 각 이벤트는 id·event(kind)·data(EventEnvelope JSON) 필드를 갖습니다.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            text/event-stream:
              schema:
                type: string
                description: "data 본문의 정본: packages/contracts/schema/stream.schema.json의 EventEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/StreamCapacity"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        AUTH_MODE=oidc|mock일 때 필요한 Bearer JWT입니다. AUTH_MODE=none이면 정적 Scope로
        동작합니다. /healthz · /readyz · /version은 어느 모드에서든 인증이 필요 없습니다.
  headers:
    XRequestID:
      description: >-
        요청 상관관계 ID. 인바운드 X-Request-ID가 1..128자의 [A-Za-z0-9._:-]이면 재사용하고,
        아니면 서버가 128bit 난수 소문자 hex를 새로 만듭니다. 에러 본문 requestId와 같은 값입니다.
      schema:
        type: string
        pattern: "^[A-Za-z0-9._:-]{1,128}$"
    DashboardRevisionETag:
      description: Current optimistic-lock revision.
      schema: {type: string, pattern: '^"revision-[1-9][0-9]*"$'}
    DashboardExportETag:
      description: SHA-256 of the canonical exported bytes.
      schema: {type: string, pattern: '^"sha256-[a-f0-9]{64}"$'}
    DashboardContentDisposition:
      description: Safe DSL filename derived from the validated dashboard definition id.
      schema: {type: string, pattern: '^attachment; filename="[a-z][a-z0-9-]{0,63}\.json"$'}
  parameters:
    IfMatchRevision:
      name: If-Match
      in: header
      required: true
      schema: {type: string, pattern: '^"revision-[1-9][0-9]*"$'}
    IfNoneMatchExport:
      name: If-None-Match
      in: header
      required: false
      description: Optional canonical export ETag returned by a previous successful export.
      schema: {type: string, pattern: '^"sha256-[a-f0-9]{64}"$'}
    DashboardListLimit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 50, default: 50}
    DashboardCursor:
      name: cursor
      in: query
      required: false
      description: Opaque, authenticated keyset cursor. It contains no owner or subject text.
      schema: {type: string, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$"}
    ClusterId:
      name: clusterId
      in: path
      required: true
      description: 클러스터 ID. Scope 밖이면 403입니다.
      schema:
        type: string
    Ns:
      name: ns
      in: query
      description: Scope와 교차해 적용할 namespace. 비우거나 all이면 Scope 전체입니다.
      schema:
        type: string
    Range:
      name: range
      in: query
      description: 조회 범위 프리셋 (1h·1d·7d·30d). Step은 서버가 범위에 따라 강제합니다.
      schema:
        type: string
    From:
      name: from
      in: query
      description: Custom 범위 시작. RFC3339 또는 epoch milliseconds 숫자 문자열이며 from/to는 함께 씁니다.
      schema:
        oneOf:
          - type: string
            format: date-time
          - type: string
            pattern: "^-?[0-9]+$"
    To:
      name: to
      in: query
      description: Custom 범위 끝. RFC3339 또는 epoch milliseconds 숫자 문자열입니다.
      schema:
        oneOf:
          - type: string
            format: date-time
          - type: string
            pattern: "^-?[0-9]+$"
    LastEventID:
      name: Last-Event-ID
      in: header
      required: false
      description: >-
        마지막으로 수신한 SSE id. 브라우저 EventSource가 재연결 시 자동으로 보냅니다.
        서버가 만든 형식(`<hex 인스턴스>-<십진 시퀀스>`, 최대 64자)이 아니면 400입니다.
      schema:
        type: string
        maxLength: 64
        pattern: "^[0-9a-f]{32}-[0-9]{1,20}$"
  requestBodies:
    DashboardDefinitionRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DashboardDefinitionRequest"
  responses:
    DashboardCapabilitiesOK:
      description: Dashboard Builder availability and server-authoritative permissions.
      headers: {X-Request-ID: {$ref: "#/components/headers/XRequestID"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/DashboardCapabilities"}}}
    DashboardDraftOK:
      description: Dashboard draft envelope.
      headers:
        X-Request-ID: {$ref: "#/components/headers/XRequestID"}
        ETag: {$ref: "#/components/headers/DashboardRevisionETag"}
      content: {application/json: {schema: {$ref: "#/components/schemas/DashboardDraft"}}}
    DashboardPageOK:
      description: Bounded keyset page of visible dashboard drafts.
      headers: {X-Request-ID: {$ref: "#/components/headers/XRequestID"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/DashboardDraftPage"}}}
    DashboardCreated:
      description: Dashboard created
      headers:
        X-Request-ID: {$ref: "#/components/headers/XRequestID"}
        ETag: {$ref: "#/components/headers/DashboardRevisionETag"}
      content: {application/json: {schema: {$ref: "#/components/schemas/DashboardDraft"}}}
    DashboardNoContent:
      description: Dashboard deleted
      headers: {X-Request-ID: {$ref: "#/components/headers/XRequestID"}}
    DashboardNotModified:
      description: Export ETag matched
      headers:
        X-Request-ID: {$ref: "#/components/headers/XRequestID"}
        ETag: {$ref: "#/components/headers/DashboardExportETag"}
    DashboardExportOK:
      description: Canonical approved Dashboard DSL JSON with a trailing newline.
      headers:
        X-Request-ID: {$ref: "#/components/headers/XRequestID"}
        ETag: {$ref: "#/components/headers/DashboardExportETag"}
        Content-Disposition: {$ref: "#/components/headers/DashboardContentDisposition"}
      content: {application/json: {schema: {$ref: "#/components/schemas/DashboardDefinition"}}}
    DashboardError:
      description: Dashboard error
      headers: {X-Request-ID: {$ref: "#/components/headers/XRequestID"}}
      content: {application/json: {schema: {$ref: "#/components/schemas/APIError"}}}
    StreamCapacity:
      description: >-
        스트림 연결 상한(전역 또는 주체별) 초과입니다. Retry-After 이후 재시도하세요.
        질의 보호(#11)의 429와 달리 스트림 전용 상한입니다.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        Retry-After:
          description: 재시도까지 대기할 초
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    BadRequest:
      description: 요청이 성립하지 않습니다 (예 invalid_range).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    Unauthorized:
      description: 인증이 필요합니다.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    Forbidden:
      description: 요청한 클러스터·namespace가 Scope 밖입니다. 부분 데이터도 내려가지 않습니다.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    NotFound:
      description: 등록되지 않은 경로입니다.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    MethodNotAllowed:
      description: 허용되지 않은 메서드입니다. Allow 헤더에 허용 메서드가 담깁니다.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        Allow:
          description: 허용 메서드 (전 라우트 GET)
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    InternalError:
      description: 서버 내부 오류입니다. 내부 주소·질의·스택트레이스는 담기지 않습니다.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    ServiceUnavailable:
      description: 스트림 런타임이 준비되지 않았습니다.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
  schemas:
    DashboardCapabilities:
      type: object
      additionalProperties: false
      required: [enabled, canEdit, canPublish, maxDrafts, maxWidgets]
      properties:
        enabled: {type: boolean}
        canEdit: {type: boolean}
        canPublish: {type: boolean}
        maxDrafts: {type: integer, const: 32}
        maxWidgets: {type: integer, const: 24}
    DashboardDefinitionRequest:
      type: object
      additionalProperties: false
      required: [definition]
      properties:
        definition: {$ref: "#/components/schemas/DashboardDefinition"}
    DashboardDefinition:
      type: object
      additionalProperties: false
      description: >-
        Dashboard DSL v1. Exact type-specific semantics and the Query Catalog allowlist are
        enforced by packages/dashboard-schema/schema/dashboard.schema.json and the shared
        Go/runtime parity corpus. Canonical exported bytes are limited to 65536.
      x-canonical-max-bytes: 65536
      required: [schemaVersion, id, title, variables, widgets]
      properties:
        schemaVersion: {type: integer, const: 1}
        id: {type: string, pattern: "^[a-z][a-z0-9-]{0,63}$"}
        title: {type: string, minLength: 1, maxLength: 160}
        description: {type: string, minLength: 1, maxLength: 160}
        variables:
          type: array
          maxItems: 2
          items:
            type: object
            additionalProperties: false
            required: [id, label, kind]
            properties:
              id: {type: string, pattern: "^[a-z][a-z0-9-]{0,63}$"}
              label: {type: string, minLength: 1, maxLength: 160}
              kind: {type: string, enum: [scope, range]}
        widgets:
          type: array
          minItems: 1
          maxItems: 24
          items:
            type: object
            additionalProperties: false
            required: [id, title, type, binding, layout]
            properties:
              id: {type: string, pattern: "^[a-z][a-z0-9-]{0,63}$"}
              title: {type: string, minLength: 1, maxLength: 160}
              type: {type: string, enum: [TimeSeries, Stat, Gauge, Table, LogStream, EventTimeline]}
              binding: {type: string, enum: [trends, nodes.ready, pods.running, pods.runningPercent, unhealthy, unsupported.logs, events]}
              queryRefs:
                type: array
                minItems: 1
                maxItems: 8
                uniqueItems: true
                items: {type: string, minLength: 1, maxLength: 160}
              options:
                type: object
                additionalProperties: false
                required: [maxRows]
                properties: {maxRows: {type: integer, minimum: 1, maximum: 5000}}
              layout:
                type: object
                additionalProperties: false
                required: [x, y, w, h]
                properties:
                  x: {type: integer, minimum: 0, maximum: 11}
                  y: {type: integer, minimum: 0, maximum: 95}
                  w: {type: integer, minimum: 1, maximum: 12}
                  h: {type: integer, minimum: 1, maximum: 96}
    DashboardDraft:
      type: object
      additionalProperties: false
      required: [id, revision, state, owned, schemaVersion, definition, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        revision: {type: integer, format: int64, minimum: 1}
        state: {type: string, enum: [draft, submitted, approved]}
        owned: {type: boolean}
        schemaVersion: {type: integer, const: 1}
        definition: {$ref: "#/components/schemas/DashboardDefinition"}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    DashboardDraftPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items: {$ref: "#/components/schemas/DashboardDraft"}
        nextCursor: {type: string, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$"}
    APIError:
      type: object
      description: 화면 전체가 실패했을 때만 쓰는 최상위 에러. 섹션 단위 실패는 Section 값입니다.
      required:
        - code
        - message
        - requestId
      properties:
        code:
          type: string
          enum:
            - unauthorized
            - forbidden
            - not_found
            - method_not_allowed
            - upstream_unavailable
            - invalid_range
            - bad_last_event_id
            - stream_capacity
            - internal
            - invalid_dashboard
            - invalid_revision
            - invalid_page
            - invalid_cursor
            - precondition_required
            - revision_conflict
            - draft_limit
            - approved_immutable
            - invalid_state
            - unsupported_media_type
            - body_too_large
            - dashboard_store_unavailable
        message:
          type: string
        requestId:
          type: string
          description: 응답 헤더 X-Request-ID와 같은 값
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          const: ok
    ReadyStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          const: syncing
    VersionInfo:
      type: object
      required:
        - version
        - commit
        - buildDate
      properties:
        version:
          type: string
        commit:
          type: string
        buildDate:
          type: string
    # 화면 응답 DTO — 필드 정의의 원본은 packages/contracts/src/index.ts입니다.
    # 여기서 전체 모델을 복제하면 두 곳을 관리하게 되므로 이름만 고정합니다.
    ScopeResponse:
      type: object
      description: "원본: src/index.ts의 ScopeResponse"
    ClusterOverviewResponse:
      type: object
      description: "원본: src/index.ts의 ClusterOverviewResponse"
    NamespaceListResponse:
      type: object
      description: "원본: src/index.ts의 NamespaceListResponse"
    NamespaceDetailResponse:
      type: object
      description: "원본: src/index.ts의 NamespaceDetailResponse"
    WorkloadDetailResponse:
      type: object
      description: "원본: src/index.ts의 WorkloadDetailResponse"
    PodDetailResponse:
      type: object
      description: "원본: src/index.ts의 PodDetailResponse"
    LogSearchResponse:
      type: object
      description: "원본: src/index.ts의 LogSearchResponse"
    TopologyResponse:
      type: object
      description: "원본: src/index.ts의 TopologyResponse"
    TopologyEdgeSeriesResponse:
      type: object
      description: "원본: src/index.ts의 TopologyEdgeSeriesResponse"
    AlertListResponse:
      type: object
      description: "원본: src/index.ts의 AlertListResponse"
