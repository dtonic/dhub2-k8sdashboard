{{- define "cluster-state-agent.validCIDR" -}}
{{- $parts := splitList "/" . -}}
{{- if ne (len $parts) 2 }}{{ fail "CIDR must be canonical IPv4 CIDR" }}{{ end -}}
{{- $octets := splitList "." (index $parts 0) -}}
{{- if or (ne (len $octets) 4) (not (regexMatch "^[0-9]+$" (index $parts 1))) (lt (atoi (index $parts 1)) 1) (gt (atoi (index $parts 1)) 32) }}{{ fail "CIDR must be canonical IPv4 CIDR" }}{{ end -}}
{{- range $octets }}{{- if or (not (regexMatch "^[0-9]{1,3}$" .)) (gt (atoi .) 255) }}{{ fail "CIDR must be canonical IPv4 CIDR" }}{{ end -}}{{- end -}}
{{- if eq . "0.0.0.0/0" }}{{ fail "unbounded CIDR is forbidden" }}{{ end -}}
{{- end -}}
{{- if ne .Values.clusterID .Values.telemetryClusterName }}{{ fail "clusterID must exactly equal telemetryClusterName" }}{{ end -}}
{{- range .Values.registry.cidrs }}{{ include "cluster-state-agent.validCIDR" . }}{{- end -}}
{{- range .Values.kubernetesApiCidrs }}{{ include "cluster-state-agent.validCIDR" . }}{{- end -}}
{{- $dns := "^[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:\\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*$" -}}
{{- $endpointParts := splitList ":" .Values.registry.endpoint -}}
{{- if or (ne (len $endpointParts) 2) (not (regexMatch $dns (index $endpointParts 0))) (not (regexMatch $dns .Values.registry.serverName)) }}{{ fail "registry endpoint or server name is invalid" }}{{ end -}}
{{- if or (ne (len $endpointParts) 2) (empty (index $endpointParts 0)) (lt (atoi (index $endpointParts 1)) 1) (gt (atoi (index $endpointParts 1)) 65535) }}{{ fail "registry endpoint port is invalid" }}{{ end -}}
{{- if ne (atoi (index $endpointParts 1)) (int .Values.registry.port) }}{{ fail "registry endpoint and NetworkPolicy ports must match" }}{{ end -}}
{{- if or (lt (int .Values.limits.maxChunkResources) 1) (gt (int .Values.limits.maxChunkResources) 1000) (gt (int .Values.limits.maxChunkResources) (int .Values.limits.maxResources)) }}{{ fail "snapshot chunk resource limit is invalid" }}{{ end -}}
{{- if or (eq .Values.tls.certKey .Values.tls.privateKeyKey) (eq .Values.tls.certKey .Values.tls.caKey) (eq .Values.tls.privateKeyKey .Values.tls.caKey) }}{{ fail "agent TLS Secret keys must be distinct" }}{{ end -}}
apiVersion: v1
kind: ServiceAccount
metadata: {name: {{ .Release.Name }}-cluster-state-agent}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: {{ .Release.Name }}-cluster-state-agent-read}
rules:
  - {apiGroups: [""], resources: [pods, namespaces, nodes, events], verbs: [get, list, watch]}
  - {apiGroups: [apps], resources: [deployments, statefulsets, daemonsets, replicasets], verbs: [get, list, watch]}
  - {apiGroups: [batch], resources: [cronjobs], verbs: [get, list, watch]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: {{ .Release.Name }}-cluster-state-agent-read}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ .Release.Name }}-cluster-state-agent-read}
subjects: [{kind: ServiceAccount, name: {{ .Release.Name }}-cluster-state-agent, namespace: {{ .Release.Namespace }}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ .Release.Name }}-cluster-state-agent}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: cluster-state-agent, app.kubernetes.io/instance: {{ .Release.Name }}}}
  template:
    metadata: {labels: {app.kubernetes.io/name: cluster-state-agent, app.kubernetes.io/instance: {{ .Release.Name }}}}
    spec:
      serviceAccountName: {{ .Release.Name }}-cluster-state-agent
      automountServiceAccountToken: true
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: agent
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}
          command: ["/cluster-state-agent"]
          securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
          env:
            - {name: CLUSTER_ID, value: {{ .Values.clusterID | quote }}}
            - {name: CLUSTER_STATE_REGISTRY_ENDPOINT, value: {{ .Values.registry.endpoint | quote }}}
            - {name: CLUSTER_STATE_REGISTRY_SERVER_NAME, value: {{ .Values.registry.serverName | quote }}}
            - {name: CLUSTER_STATE_TRUST_DOMAIN, value: {{ .Values.registry.trustDomain | quote }}}
            - {name: CLUSTER_STATE_TLS_CERT_FILE, value: /var/run/cluster-state-tls/tls.crt}
            - {name: CLUSTER_STATE_TLS_KEY_FILE, value: /var/run/cluster-state-tls/tls.key}
            - {name: CLUSTER_STATE_TLS_CA_FILE, value: /var/run/cluster-state-tls/ca.crt}
            - {name: CLUSTER_STATE_MAX_RESOURCES, value: {{ .Values.limits.maxResources | quote }}}
            - {name: CLUSTER_STATE_MAX_MESSAGE_BYTES, value: {{ .Values.limits.maxMessageBytes | quote }}}
            - {name: CLUSTER_STATE_MAX_CHUNK_RESOURCES, value: {{ .Values.limits.maxChunkResources | quote }}}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts: [{name: tls, mountPath: /var/run/cluster-state-tls, readOnly: true}]
      volumes:
        - name: tls
          secret:
            secretName: {{ .Values.tls.existingSecret }}
            items:
              - {key: {{ .Values.tls.certKey }}, path: tls.crt}
              - {key: {{ .Values.tls.privateKeyKey }}, path: tls.key}
              - {key: {{ .Values.tls.caKey }}, path: ca.crt}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ .Release.Name }}-cluster-state-agent}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: cluster-state-agent, app.kubernetes.io/instance: {{ .Release.Name }}}}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector: {{ toYaml .Values.dns.namespaceSelector | nindent 12 }}
          podSelector: {{ toYaml .Values.dns.podSelector | nindent 12 }}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    {{- range .Values.kubernetesApiCidrs }}
    - to: [{ipBlock: {cidr: {{ . | quote }}}}]
      ports: [{protocol: TCP, port: 443}]
    {{- end }}
    {{- range .Values.registry.cidrs }}
    - to: [{ipBlock: {cidr: {{ . | quote }}}}]
      ports: [{protocol: TCP, port: {{ $.Values.registry.port }}}]
    {{- end }}
