clusterState:
  mode: central
  clusters: [cluster-a, cluster-b]
  trustDomain: platform.example
  registryEndpoint: dashboard-observability-dashboard-cluster-state-registry:9444
  registryServerName: registry.platform.example
  tls: {apiExistingSecret: cluster-state-api-mtls, registryExistingSecret: cluster-state-registry-mtls}
  registry:
    image:
      repository: registry.example.invalid/observability-dashboard-api
      tag: ""
      digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    agentService: {type: LoadBalancer, sourceCidrs: [192.0.2.0/24]}
api:
  config:
    AUTH_MODE: oidc
    USE_DEMO_DATA: "false"
    OIDC_ISSUER: https://issuer.example.invalid
    OIDC_AUDIENCE: dashboard
    GREPTIME_URL: https://greptime.example.invalid
    QUICKWIT_URL: https://quickwit.example.invalid
    QUICKWIT_FIELDS: timestamp=timestamp,level=severity_text,message=body.message,namespace=resource_attributes.k8s.namespace.name,pod_name=resource_attributes.k8s.pod.name,pod_uid=resource_attributes.k8s.pod.uid,container=resource_attributes.k8s.container.name,workload_kind=resource_attributes.k8s.workload.kind,workload_name=resource_attributes.k8s.workload.name,node=resource_attributes.k8s.node.name,trace_id=trace_id,span_id=span_id,event_id=attributes.event_id,cluster=resource_attributes.k8s.cluster.name
