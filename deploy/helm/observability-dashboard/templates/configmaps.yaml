{{- include "dashboard.validate" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dashboard.fullname" . }}-api
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.api.config }}
  {{- if not (and (eq $.Values.telemetry.mode "cutover") (has $key (list "QUICKWIT_INDEX" "QUICKWIT_FIELDS"))) }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
  {{- if eq .Values.telemetry.mode "cutover" }}
  QUICKWIT_INDEX: {{ .Values.telemetry.backends.quickwit.index | quote }}
  QUICKWIT_FIELDS: "timestamp=timestamp_nanos,level=severity_text,message=body.message,namespace=resource_attributes.k8s.namespace.name,pod_name=resource_attributes.k8s.pod.name,pod_uid=resource_attributes.k8s.pod.uid,container=resource_attributes.k8s.container.name,workload_kind=resource_attributes.k8s.workload.kind,workload_name=resource_attributes.k8s.workload.name,node=resource_attributes.k8s.node.name,trace_id=trace_id,span_id=span_id,event_id=attributes.event_id,cluster=resource_attributes.k8s.cluster.name"
  {{- end }}
  {{- if .Values.redis.enabled }}
  REDIS_ADDR: {{ printf "%s-redis:6379" (include "dashboard.fullname" .) | quote }}
  {{- end }}
  {{- if .Values.resourceExplorer.enabled }}
  {{- if ne .Values.clusterState.mode "direct" }}
  {{- fail "resourceExplorer.enabled requires clusterState.mode=direct — central 모드에는 로컬 informer가 없어 API가 기동하지 않습니다" }}
  {{- end }}
  {{- /* allowlist는 API와 RBAC이 같은 목록을 씁니다(serviceaccounts-rbac.yaml 참고). */}}
  RESOURCE_EXPLORER_ENABLED: "true"
  RESOURCE_EXPLORER_REFRESH: {{ .Values.resourceExplorer.refresh | quote }}
  RESOURCE_EXPLORER_ALLOW_CRDS: {{ .Values.resourceExplorer.allowCRDs | quote }}
  RESOURCE_EXPLORER_RESOURCES: {{ join "," .Values.resourceExplorer.resources | quote }}
  RESOURCE_EXPLORER_DETAIL_RATE: {{ .Values.resourceExplorer.detail.rate | quote }}
  RESOURCE_EXPLORER_DETAIL_BURST: {{ printf "%d" (int .Values.resourceExplorer.detail.burst) | quote }}
  RESOURCE_EXPLORER_DETAIL_CONCURRENT: {{ printf "%d" (int .Values.resourceExplorer.detail.concurrent) | quote }}
  RESOURCE_EXPLORER_DETAIL_TIMEOUT: {{ .Values.resourceExplorer.detail.timeout | quote }}
  RESOURCE_EXPLORER_MAX_OBJECT_BYTES: {{ printf "%d" (int64 .Values.resourceExplorer.detail.maxObjectBytes) | quote }}
  {{- if .Values.resourceExplorer.dryRun.enabled }}
  {{- /* 변경 검토(ADR 0019 Phase 1)는 두 번째 opt-in입니다. 대상 목록은 API의
       allowlist로 그대로 나가고, deny는 **서버가 한 번만** 적용합니다. RBAC은
       serviceaccounts-rbac.yaml이 deny를 뺀 최종 목록으로 따로 계산합니다. */}}
  {{- $dry := .Values.resourceExplorer.dryRun }}
  {{- if eq (len $dry.resources) 0 }}
  {{- fail "resourceExplorer.dryRun.enabled requires a non-empty resourceExplorer.dryRun.resources" }}
  {{- end }}
  {{- if gt (len $dry.resources) 64 }}
  {{- fail "resourceExplorer.dryRun.resources must not exceed 64 entries" }}
  {{- end }}
  {{- range $dry.resources }}
  {{- if not (has . $.Values.resourceExplorer.resources) }}
  {{- fail (printf "resourceExplorer.dryRun.resources %q must also be in resourceExplorer.resources" .) }}
  {{- end }}
  {{- $parts := splitList "/" . }}
  {{- $group := index $parts 0 }}
  {{- $name := index $parts 2 }}
  {{- if eq $group "core" }}{{- $group = "" }}{{- end }}
  {{- /* 설정으로 뚫을 수 없는 거부. 정확히 이것뿐이고 더 넓히지 않습니다.
       조용히 빼지 않고 렌더를 실패시킵니다 — 켰다고 믿는 채로 없는 것보다 낫습니다. */}}
  {{- if eq $group "rbac.authorization.k8s.io" }}
  {{- fail (printf "resourceExplorer.dryRun.resources %q is permanently denied (rbac.authorization.k8s.io)" .) }}
  {{- end }}
  {{- if and (eq $group "") (has $name (list "secrets" "serviceaccounts" "nodes" "namespaces")) }}
  {{- fail (printf "resourceExplorer.dryRun.resources %q is permanently denied (core %s)" . $name) }}
  {{- end }}
  {{- if and (eq $group "apiextensions.k8s.io") (eq $name "customresourcedefinitions") }}
  {{- fail (printf "resourceExplorer.dryRun.resources %q is permanently denied (customresourcedefinitions)" .) }}
  {{- end }}
  {{- end }}
  {{- range $dry.denyResources }}
  {{- if not (has . $dry.resources) }}
  {{- fail (printf "resourceExplorer.dryRun.denyResources %q must also be in resourceExplorer.dryRun.resources" .) }}
  {{- end }}
  {{- end }}
  {{- $final := list }}
  {{- range $dry.resources }}
  {{- if not (has . $dry.denyResources) }}{{- $final = append $final . }}{{- end }}
  {{- end }}
  {{- if eq (len $final) 0 }}
  {{- fail "resourceExplorer.dryRun.denyResources removed every entry — nothing would be reviewable" }}
  {{- end }}
  RESOURCE_EXPLORER_DRY_RUN_ENABLED: "true"
  RESOURCE_EXPLORER_DRY_RUN_RESOURCES: {{ join "," $dry.resources | quote }}
  RESOURCE_EXPLORER_DRY_RUN_DENY_RESOURCES: {{ join "," $dry.denyResources | quote }}
  RESOURCE_EXPLORER_DRY_RUN_TIMEOUT: {{ $dry.timeout | quote }}
  RESOURCE_EXPLORER_DRY_RUN_RATE: {{ $dry.rate | quote }}
  RESOURCE_EXPLORER_DRY_RUN_BURST: {{ printf "%d" (int $dry.burst) | quote }}
  RESOURCE_EXPLORER_DRY_RUN_CONCURRENT: {{ printf "%d" (int $dry.concurrent) | quote }}
  RESOURCE_EXPLORER_DRY_RUN_MAX_MANIFEST_BYTES: {{ printf "%d" (int64 $dry.maxManifestBytes) | quote }}
  RESOURCE_EXPLORER_DRY_RUN_MAX_OBJECT_BYTES: {{ printf "%d" (int64 $dry.maxObjectBytes) | quote }}
  {{- end }}
  {{- end }}
  {{- if and .Values.resourceExplorer.dryRun.enabled (not .Values.resourceExplorer.enabled) }}
  {{- /* Explorer 블록 **밖**이어야 합니다. 안에 두면 Explorer가 꺼진 채 검토만 켠
       설정이 검사 자체를 건너뛰고 통과합니다. central 조합은 Explorer 검사가 막습니다. */}}
  {{- fail "resourceExplorer.dryRun.enabled requires resourceExplorer.enabled" }}
  {{- end }}
  {{- if .Values.authSession.enabled }}
  AUTH_SESSION_ENABLED: "true"
  AUTH_PUBLIC_ORIGIN: {{ .Values.authSession.publicOrigin | quote }}
  OIDC_REDIRECT_URI: {{ .Values.authSession.redirectURI | quote }}
  OIDC_CLIENT_ID: {{ .Values.authSession.clientID | quote }}
  AUTH_SESSION_IDLE_TTL: {{ .Values.authSession.idleTTL | quote }}
  AUTH_SESSION_ABSOLUTE_TTL: {{ .Values.authSession.absoluteTTL | quote }}
  AUTH_LOGIN_TTL: {{ .Values.authSession.loginTTL | quote }}
  AUTH_REFRESH_SKEW: {{ .Values.authSession.refreshSkew | quote }}
  AUTH_SESSION_MAX: {{ .Values.authSession.maxSessions | quote }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dashboard.fullname" . }}-nginx
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      {{- /* SPA 셸이 배포를 넘어 브라우저 캐시로 살아남지 않도록 매 요청 재검증을
           강제합니다. 해시된 정적 자산은 검증자 기반 304로 재사용되므로 비용이 작고,
           auth 모드 전환 직후 사용자가 이전 셸을 계속 실행하는 문제를 막습니다. */}}
      add_header Cache-Control "no-cache" always;
      {{- if .Values.authSession.enabled }}
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "no-referrer" always;
      sub_filter '<meta name="k8s-auth-session" content="disabled" />' '<meta name="k8s-auth-session" content="enabled" />';
      sub_filter_once on;
      {{- end }}
      {{- if .Values.managerAuth.enabled }}
      {{- /* Dhub2.0 인증 위임: UI가 manager origin으로 XHR하므로 connect-src에 허용합니다. */}}
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' {{ .Values.managerAuth.origin }}; font-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "no-referrer" always;
      sub_filter '<meta name="k8s-auth-manager-origin" content="" />' '<meta name="k8s-auth-manager-origin" content="{{ .Values.managerAuth.origin }}" />';
      sub_filter '<meta name="k8s-auth-manager-login" content="" />' '<meta name="k8s-auth-manager-login" content="{{ .Values.managerAuth.loginURL }}" />';
      sub_filter '<meta name="k8s-auth-manager-client-id" content="" />' '<meta name="k8s-auth-manager-client-id" content="{{ .Values.managerAuth.clientID }}" />';
      sub_filter_once on;
      {{- end }}

      location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        {{- if .Values.authSession.enabled }}
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        {{- end }}
        return 200 "ok\n";
      }

      location /api/ {
        proxy_pass http://{{ include "dashboard.fullname" . }}-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Last-Event-ID $http_last_event_id;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no always;
        {{- if .Values.authSession.enabled }}
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        {{- end }}
      }

      {{- if .Values.authSession.enabled }}
      location = /api/v1/auth/callback {
        access_log off;
        proxy_pass http://{{ include "dashboard.fullname" . }}-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
      }
      {{- end }}

      location / {
        try_files $uri $uri/ /index.html;
      }
    }
{{- if .Values.networkPolicy.monitoring.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dashboard.fullname" . }}-grafana-dashboard
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  observability-dashboard-platform.json: |-
{{ .Files.Get "files/dashboard.json" | indent 4 }}
{{- end }}
