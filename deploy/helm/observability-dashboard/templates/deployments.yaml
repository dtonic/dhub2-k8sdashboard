apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dashboard.fullname" . }}-ui
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: {{ .Values.ui.replicas }}
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "dashboard.selector" . | nindent 6 }}
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        {{- include "dashboard.selector" . | nindent 8 }}
        app.kubernetes.io/component: ui
      annotations:
        checksum/nginx: {{ include (print $.Template.BasePath "/configmaps.yaml") . | sha256sum }}
        secret-revision: {{ .Values.secretRevision | quote }}
    spec:
      serviceAccountName: {{ include "dashboard.fullname" . }}-ui
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "dashboard.selector" . | nindent 14 }}
              app.kubernetes.io/component: ui
      containers:
        - name: ui
          image: {{ printf "%s%s" .Values.ui.image.repository (ternary (printf "@%s" .Values.ui.image.digest) (printf ":%s" .Values.ui.image.tag) (ne .Values.ui.image.digest "")) | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          ports: [{name: http, containerPort: 8080}]
          lifecycle: {preStop: {sleep: {seconds: 5}}}
          startupProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 2, failureThreshold: 30}
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 5, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10, failureThreshold: 3}
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          volumeMounts:
            - {name: nginx-config, mountPath: /etc/nginx/conf.d, readOnly: true}
            - {name: nginx-cache, mountPath: /var/cache/nginx}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: nginx-config
          configMap: {name: {{ include "dashboard.fullname" . }}-nginx}
        - {name: nginx-cache, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dashboard.fullname" . }}-api
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if and .Values.dashboardBuilder.enabled .Values.dashboardBuilder.sqlite.enabled }}
  {{- /* SQLite draft store는 단일 writer + RWO PVC이므로 replicas=1 + Recreate로 강제합니다. (ADR 0016) */}}
  replicas: 1
  minReadySeconds: 10
  strategy:
    type: Recreate
  {{- else }}
  replicas: {{ .Values.api.replicas }}
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  {{- end }}
  selector:
    matchLabels:
      {{- include "dashboard.selector" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "dashboard.selector" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmaps.yaml") . | sha256sum }}
        secret-revision: {{ .Values.secretRevision | quote }}
    spec:
      {{- if eq .Values.clusterState.mode "direct" }}
      serviceAccountName: {{ include "dashboard.fullname" . }}-api
      automountServiceAccountToken: true
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      terminationGracePeriodSeconds: 30
      {{- if or .Values.alerts.enabled (and .Values.dashboardBuilder.enabled .Values.dashboardBuilder.sqlite.enabled) }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      {{- else }}
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "dashboard.selector" . | nindent 14 }}
              app.kubernetes.io/component: api
      containers:
        - name: api
          image: {{ printf "%s%s" .Values.api.image.repository (ternary (printf "@%s" .Values.api.image.digest) (printf ":%s" .Values.api.image.tag) (ne .Values.api.image.digest "")) | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          ports: [{name: http, containerPort: 8080}]
          envFrom: [{configMapRef: {name: {{ include "dashboard.fullname" . }}-api}}]
          {{- if eq .Values.clusterState.mode "central" }}
          env:
            - {name: CLUSTER_STATE_MODE, value: central}
            - {name: CLUSTER_STATE_CLUSTERS, value: {{ join "," .Values.clusterState.clusters | quote }}}
            - {name: CLUSTER_STATE_REGISTRY_ENDPOINT, value: {{ .Values.clusterState.registryEndpoint | quote }}}
            - {name: CLUSTER_STATE_REGISTRY_SERVER_NAME, value: {{ .Values.clusterState.registryServerName | quote }}}
            - {name: CLUSTER_STATE_TRUST_DOMAIN, value: {{ .Values.clusterState.trustDomain | quote }}}
            - {name: CLUSTER_STATE_TLS_CERT_FILE, value: /var/run/cluster-state-tls/tls.crt}
            - {name: CLUSTER_STATE_TLS_KEY_FILE, value: /var/run/cluster-state-tls/tls.key}
            - {name: CLUSTER_STATE_TLS_CA_FILE, value: /var/run/cluster-state-tls/ca.crt}
          {{- end }}
          {{- with .Values.api.existingSecret.name }}
          {{- if ne $.Values.clusterState.mode "central" }}
          env:
          {{- end }}
            {{- range $env, $key := dict "GREPTIME_USERNAME" $.Values.api.existingSecret.keys.greptimeUsername "GREPTIME_PASSWORD" $.Values.api.existingSecret.keys.greptimePassword "QUICKWIT_USERNAME" $.Values.api.existingSecret.keys.quickwitUsername "QUICKWIT_PASSWORD" $.Values.api.existingSecret.keys.quickwitPassword }}
            - name: {{ $env }}
              valueFrom: {secretKeyRef: {name: {{ $.Values.api.existingSecret.name }}, key: {{ $key }}, optional: true}}
            {{- end }}
            {{- if not $.Values.redis.enabled }}
            - name: REDIS_ADDR
              valueFrom: {secretKeyRef: {name: {{ $.Values.api.existingSecret.name }}, key: {{ $.Values.api.existingSecret.keys.redisAddr }}, optional: false}}
            {{- end }}
            {{- if $.Values.dashboardBuilder.enabled }}
            - name: DASHBOARD_BUILDER_ENABLED
              value: "true"
            - name: DASHBOARD_CURSOR_KEY
              valueFrom: {secretKeyRef: {name: {{ $.Values.api.existingSecret.name }}, key: {{ $.Values.dashboardBuilder.cursorKeyKey }}, optional: false}}
            {{- if $.Values.dashboardBuilder.sqlite.enabled }}
            {{- /* SQLite 파일 백엔드 (ADR 0016) — PVC 경로만 지정하면 됩니다. */}}
            - name: DASHBOARD_DB_PATH
              value: {{ $.Values.dashboardBuilder.sqlite.path | quote }}
            - name: DASHBOARD_DB_CONNECT_TIMEOUT
              value: {{ $.Values.dashboardBuilder.connectTimeout | quote }}
            {{- else }}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ $.Values.api.existingSecret.name }}, key: {{ $.Values.dashboardBuilder.databaseURLKey }}, optional: false}}
            - name: DASHBOARD_DB_MAX_CONNS
              value: {{ $.Values.dashboardBuilder.maxConnections | quote }}
            - name: DASHBOARD_DB_CONNECT_TIMEOUT
              value: {{ $.Values.dashboardBuilder.connectTimeout | quote }}
            - name: DASHBOARD_DB_REQUIRE_TLS
              value: {{ $.Values.dashboardBuilder.requireTLS | quote }}
            {{- end }}
            {{- end }}
            {{- if $.Values.authSession.enabled }}
            - name: AUTH_SESSION_KEY
              valueFrom: {secretKeyRef: {name: {{ $.Values.api.existingSecret.name }}, key: {{ $.Values.api.existingSecret.keys.authSessionKey }}, optional: false}}
            - name: OIDC_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: {{ $.Values.api.existingSecret.name }}, key: {{ $.Values.api.existingSecret.keys.oidcClientSecret }}, optional: true}}
            {{- end }}
          {{- end }}
          {{- if .Values.alerts.enabled }}
          {{- if and (ne .Values.clusterState.mode "central") (empty .Values.api.existingSecret.name) }}
          env:
          {{- end }}
            - {name: ALERTMANAGER_ENABLED, value: "true"}
            - {name: ALERTMANAGER_URL, value: {{ .Values.alerts.url | quote }}}
            - {name: ALERTMANAGER_PUBLIC_URL, value: {{ .Values.alerts.publicURL | quote }}}
            - {name: ALERTMANAGER_SERVER_NAME, value: {{ .Values.alerts.serverName | quote }}}
            - {name: ALERTMANAGER_CLUSTER_LABEL, value: {{ .Values.alerts.clusterLabel | quote }}}
            - {name: ALERTMANAGER_NAMESPACE_LABEL, value: {{ .Values.alerts.namespaceLabel | quote }}}
            - {name: ALERTMANAGER_TIMEOUT, value: {{ .Values.alerts.timeout | quote }}}
            - {name: ALERTMANAGER_MAX_BODY_BYTES, value: {{ printf "%d" (int64 .Values.alerts.maxBodyBytes) | quote }}}
            - {name: ALERTMANAGER_MAX_ALERTS, value: {{ printf "%d" (int .Values.alerts.maxAlerts) | quote }}}
            - {name: ALERTMANAGER_MAX_CONCURRENT, value: {{ printf "%d" (int .Values.alerts.maxConcurrent) | quote }}}
            - {name: ALERTMANAGER_TOKEN_FILE, value: /var/run/alertmanager/token}
            - {name: ALERTMANAGER_CA_FILE, value: /var/run/alertmanager/ca.crt}
            {{- if .Values.alerts.existingSecret.clientCertKey }}
            - {name: ALERTMANAGER_CLIENT_CERT_FILE, value: /var/run/alertmanager/client.crt}
            - {name: ALERTMANAGER_CLIENT_KEY_FILE, value: /var/run/alertmanager/client.key}
            {{- end }}
          {{- end }}
          lifecycle: {preStop: {sleep: {seconds: 5}}}
          startupProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5, failureThreshold: 30}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10, failureThreshold: 3}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          {{- $sqlite := and .Values.dashboardBuilder.enabled .Values.dashboardBuilder.sqlite.enabled }}
          {{- if or (eq .Values.clusterState.mode "central") .Values.alerts.enabled $sqlite .Values.api.caBundle.configMapName }}
          volumeMounts:
            {{- if eq .Values.clusterState.mode "central" }}
            - {name: cluster-state-tls, mountPath: /var/run/cluster-state-tls, readOnly: true}
            {{- end }}
            {{- if .Values.alerts.enabled }}
            - {name: alertmanager, mountPath: /var/run/alertmanager, readOnly: true}
            {{- end }}
            {{- if $sqlite }}
            - {name: dashboard-drafts, mountPath: {{ dir .Values.dashboardBuilder.sqlite.path | quote }}}
            {{- end }}
            {{- if .Values.api.caBundle.configMapName }}
            - {name: ca-bundle, mountPath: /etc/dashboard-ca, readOnly: true}
            {{- end }}
          {{- end }}
      {{- $sqlite := and .Values.dashboardBuilder.enabled .Values.dashboardBuilder.sqlite.enabled }}
      {{- if or (eq .Values.clusterState.mode "central") .Values.alerts.enabled $sqlite .Values.api.caBundle.configMapName }}
      volumes:
        {{- if $sqlite }}
        - name: dashboard-drafts
          persistentVolumeClaim: {claimName: {{ include "dashboard.fullname" . }}-dashboard-drafts}
        {{- end }}
        {{- if eq .Values.clusterState.mode "central" }}
        - name: cluster-state-tls
          secret:
            secretName: {{ .Values.clusterState.tls.apiExistingSecret }}
            items:
              - {key: {{ .Values.clusterState.tls.certKey }}, path: tls.crt}
              - {key: {{ .Values.clusterState.tls.privateKeyKey }}, path: tls.key}
              - {key: {{ .Values.clusterState.tls.caKey }}, path: ca.crt}
        {{- end }}
        {{- if .Values.alerts.enabled }}
        - name: alertmanager
          secret:
            secretName: {{ .Values.alerts.existingSecret.name }}
            defaultMode: 0440
            items:
              - {key: {{ .Values.alerts.existingSecret.tokenKey }}, path: token}
              - {key: {{ .Values.alerts.existingSecret.caKey }}, path: ca.crt}
              {{- if .Values.alerts.existingSecret.clientCertKey }}
              - {key: {{ .Values.alerts.existingSecret.clientCertKey }}, path: client.crt}
              - {key: {{ .Values.alerts.existingSecret.clientKeyKey }}, path: client.key}
              {{- end }}
        {{- end }}
        {{- if .Values.api.caBundle.configMapName }}
        - name: ca-bundle
          configMap:
            name: {{ .Values.api.caBundle.configMapName }}
            items: [{key: {{ .Values.api.caBundle.key }}, path: {{ .Values.api.caBundle.key }}}]
        {{- end }}
      {{- end }}
