{{- if eq .Values.clusterState.mode "direct" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dashboard.fullname" . }}-api
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dashboard.fullname" . }}-ui
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- if .Values.redis.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dashboard.fullname" . }}-redis
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- if eq .Values.clusterState.mode "direct" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dashboard.fullname" . }}-api-read
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch"]
  {{- if .Values.manageWorkloads.enabled }}
  # 관리 기능(ADR 0014, #32)은 명시적 opt-in입니다. 꺼진 배포에서는 Secret 읽기·
  # 워크로드 write 권한이 없어 관리 엔드포인트가 fail-closed(403)됩니다.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["update", "patch"]
  {{- end }}
  {{- if .Values.resourceExplorer.enabled }}
  # Resource Explorer(ADR 0018)는 **조회 전용**입니다 — get/list/watch만 붙고
  # create/update/patch/delete는 어떤 경우에도 붙지 않습니다. 대상은 values의
  # resourceExplorer.resources 하나이며 API allowlist와 정확히 같은 목록입니다.
  # 목록은 metadata-only watch, 상세는 선택 항목 1건의 live GET에만 쓰입니다.
  {{- $byGroup := dict }}
  {{- range .Values.resourceExplorer.resources }}
  {{- $parts := splitList "/" . }}
  {{- if eq (len $parts) 3 }}
  {{- $group := index $parts 0 }}
  {{- if eq $group "core" }}{{- $group = "" }}{{- end }}
  {{- $_ := set $byGroup $group (append (get $byGroup $group | default (list)) (index $parts 2) | uniq | sortAlpha) }}
  {{- end }}
  {{- end }}
  {{- range $group, $resources := $byGroup }}
  - apiGroups: [{{ $group | quote }}]
    resources: {{ toJson $resources }}
    verbs: ["get", "list", "watch"]
  {{- end }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "dashboard.fullname" . }}-api-read
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "dashboard.fullname" . }}-api-read
subjects:
  - kind: ServiceAccount
    name: {{ include "dashboard.fullname" . }}-api
    namespace: {{ .Release.Namespace }}
{{- end }}
