{{- if eq .Values.clusterState.mode "direct" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dashboard.fullname" . }}-api
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dashboard.fullname" . }}-ui
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- if .Values.redis.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dashboard.fullname" . }}-redis
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- if eq .Values.clusterState.mode "direct" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dashboard.fullname" . }}-api-read
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch"]
  {{- if .Values.manageWorkloads.enabled }}
  # 관리 기능(ADR 0014, #32)은 명시적 opt-in입니다. 꺼진 배포에서는 Secret 읽기·
  # 워크로드 write 권한이 없어 관리 엔드포인트가 fail-closed(403)됩니다.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["update", "patch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "dashboard.fullname" . }}-api-read
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "dashboard.fullname" . }}-api-read
subjects:
  - kind: ServiceAccount
    name: {{ include "dashboard.fullname" . }}-api
    namespace: {{ .Release.Namespace }}
{{- end }}
