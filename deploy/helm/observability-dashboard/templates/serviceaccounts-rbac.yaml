apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dashboard.fullname" . }}-api
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dashboard.fullname" . }}-ui
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- if .Values.redis.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dashboard.fullname" . }}-redis
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dashboard.fullname" . }}-api-read
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "dashboard.fullname" . }}-api-read
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "dashboard.fullname" . }}-api-read
subjects:
  - kind: ServiceAccount
    name: {{ include "dashboard.fullname" . }}-api
    namespace: {{ .Release.Namespace }}
