{{- if ne .Values.telemetry.mode "disabled" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dashboard.fullname" . }}-otel-cluster
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-cluster
data:
  config.yaml: |
    extensions:
      health_check: {endpoint: 0.0.0.0:13133}
    receivers:
      k8s_cluster:
        auth_type: serviceAccount
        collection_interval: 30s
        node_conditions_to_report: [Ready]
        allocatable_types_to_report: [cpu, memory]
      prometheus/kube-state-metrics:
        config:
          scrape_configs:
            - job_name: kube-state-metrics
              static_configs:
                - targets: [{{ .Values.telemetry.clusterCollector.kubeStateMetrics.endpoint | quote }}]
              metric_relabel_configs:
                - source_labels: [__name__]
                  regex: 'kube_pod_container_resource_requests|kube_pod_container_status_restarts_total'
                  action: keep
    processors:
      filter/catalog:
        error_mode: propagate
        metrics:
          metric:
            - 'not (name == "kube_pod_container_resource_requests" or name == "kube_pod_container_status_restarts_total")'
      memory_limiter: {check_interval: 1s, limit_mib: {{ .Values.telemetry.memoryLimiter.limitMiB }}, spike_limit_mib: {{ .Values.telemetry.memoryLimiter.spikeLimitMiB }}}
      resource/cluster:
        attributes:
          - {key: k8s.cluster.name, value: {{ .Values.telemetry.clusterName | quote }}, action: upsert}
      batch: {send_batch_size: 1024, send_batch_max_size: 2048, timeout: 5s}
    exporters:
      otlp_grpc/gateway:
        endpoint: {{ printf "%s-otel-gateway:4317" (include "dashboard.fullname" .) }}
        tls: {insecure: true}
        timeout: 5s
        sending_queue: {enabled: true, num_consumers: 2, queue_size: 2048}
        retry_on_failure: {enabled: true, initial_interval: 1s, max_interval: 10s, max_elapsed_time: 60s}
    service:
      extensions: [health_check]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus: {host: 0.0.0.0, port: 8888}
      pipelines:
        metrics/cluster:
          receivers: [k8s_cluster]
          processors: [memory_limiter, resource/cluster, batch]
          exporters: [otlp_grpc/gateway]
        metrics/catalog:
          receivers: [prometheus/kube-state-metrics]
          processors: [memory_limiter, filter/catalog, resource/cluster, batch]
          exporters: [otlp_grpc/gateway]
{{- end }}
