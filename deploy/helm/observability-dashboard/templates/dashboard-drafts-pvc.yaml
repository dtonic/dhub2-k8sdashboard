{{- if and .Values.dashboardBuilder.enabled .Values.dashboardBuilder.sqlite.enabled }}
{{- /*
  Dashboard Builder draft를 담는 SQLite 파일용 PVC입니다. (ADR 0016)
  helm.sh/resource-policy: keep로 uninstall(=delete_deploy) 시에도 보존되어,
  Delete → Deploy 후에도 기존 커스텀 대시보드 draft가 그대로 복원됩니다.
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "dashboard.fullname" . }}-dashboard-drafts
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [{{ .Values.dashboardBuilder.sqlite.persistence.accessMode | quote }}]
  resources:
    requests:
      storage: {{ .Values.dashboardBuilder.sqlite.persistence.size | quote }}
  {{- with .Values.dashboardBuilder.sqlite.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
