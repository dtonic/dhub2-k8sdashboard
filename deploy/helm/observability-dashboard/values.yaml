environment: dev
nameOverride: ""
fullnameOverride: ""
imagePullPolicy: IfNotPresent
secretRevision: ""

ui:
  image: {repository: observability-dashboard-web, tag: dev, digest: ""}
  replicas: 1
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 250m, memory: 128Mi}
  autoscaling: {enabled: false, minReplicas: 2, maxReplicas: 4, targetCPUUtilizationPercentage: 70}
  pdb: {enabled: false, minAvailable: 1}

api:
  image: {repository: observability-dashboard-api, tag: dev, digest: ""}
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
  autoscaling: {enabled: false, minReplicas: 2, maxReplicas: 6, targetCPUUtilizationPercentage: 70}
  pdb: {enabled: false, minAvailable: 1}
  config:
    ADDR: ":8080"
    CLUSTER_ID: dev
    CLUSTER_NAME: Development
    AUTH_MODE: none
    SCOPE_NAMESPACES: "*"
    USE_DEMO_DATA: "true"
    OIDC_ISSUER: ""
    OIDC_AUDIENCE: ""
    GREPTIME_URL: ""
    GREPTIME_DB: public
    QUICKWIT_URL: ""
    QUICKWIT_INDEX: k8s-logs
  existingSecret:
    name: ""
    keys:
      greptimeUsername: GREPTIME_USERNAME
      greptimePassword: GREPTIME_PASSWORD
      quickwitUsername: QUICKWIT_USERNAME
      quickwitPassword: QUICKWIT_PASSWORD
      redisAddr: REDIS_ADDR
      authSessionKey: AUTH_SESSION_KEY
      oidcClientSecret: OIDC_CLIENT_SECRET
  # 사설 CA로 서명된 TLS 목적지(예: 클러스터 ingress CA가 서명한 OIDC issuer Route)를
  # 신뢰하기 위한 PEM 번들 ConfigMap. 지정하면 /etc/dashboard-ca/<key>로 마운트되며,
  # api.config에 SSL_CERT_FILE=/etc/dashboard-ca/<key>를 함께 설정해야 합니다.
  # Go는 이 번들을 기본 신뢰 디렉터리(/etc/ssl/certs)에 더해 추가로 읽습니다.
  caBundle: {configMapName: "", key: ca.crt}

# managerAuth: Dhub2.0(dhub2-manager) 인증 위임 모드. UI가 manager 로그인 세션에서
# access token을 받아(Bearer) 쓰고, API가 그 토큰을 검증합니다. api.config에
# AUTH_MODE=oidc(issuer=manager)와 OIDC_USERINFO_ROLES=true가 함께 필요하며,
# authSession과 동시에 켤 수 없습니다. loginURL은 미로그인 시 안내할 포털 주소입니다.
managerAuth:
  enabled: false
  origin: ""
  loginURL: ""
  clientID: dhub2-portal

authSession:
  enabled: false
  publicOrigin: ""
  redirectURI: ""
  clientID: ""
  # externalIngress: chart Ingress 대신 OpenShift Route·외부 LB가 publicOrigin을
  # TLS로 게시함을 운영자가 선언합니다. 이때도 HTTPS origin과 정확한 callback은 강제됩니다.
  externalIngress: false
  idleTTL: 30m
  absoluteTTL: 8h
  loginTTL: 5m
  refreshSkew: 2m
  maxSessions: 10000

# Alertmanager is an explicit, read-only opt-in. Credentials are mounted only
# from an existing Secret and are never copied into a ConfigMap or environment.
alerts:
  enabled: false
  url: ""
  publicURL: ""
  serverName: ""
  clusterLabel: k8s_cluster_name
  namespaceLabel: namespace
  timeout: 5s
  maxBodyBytes: 4194304
  maxAlerts: 2000
  maxConcurrent: 4
  existingSecret:
    name: ""
    tokenKey: token
    caKey: ca.crt
    clientCertKey: ""
    clientKeyKey: ""

# Direct is the byte-for-byte compatible default. Central mode uses only the
# shared registry and never mounts a Kubernetes service-account token.
clusterState:
  mode: direct # direct | central
  clusters: []
  trustDomain: ""
  registryEndpoint: ""
  registryServerName: ""
  tls:
    apiExistingSecret: ""
    registryExistingSecret: ""
    certKey: tls.crt
    privateKeyKey: tls.key
    caKey: ca.crt
  registry:
    image: {repository: observability-dashboard-api, tag: dev, digest: ""}
    replicas: 1
    agentPort: 9443
    queryPort: 9444
    agentService:
      type: ClusterIP
      sourceCidrs: []
    resources:
      requests: {cpu: 250m, memory: 768Mi}
      limits: {cpu: "2", memory: 1536Mi}
  limits:
    maxClusters: 64
    maxResources: 100000
    maxChunkResources: 1000
    maxMessageBytes: 4194304
    maxStateBytes: 268435456
    maxTotalStateBytes: 536870912
    ingressFrameRate: 1000
    ingressByteRate: 16777216
    ingressFrameBurst: 2000
    ingressByteBurst: 8388608
    staleTTL: 5m
    heartbeatTimeout: 45s

dashboardBuilder:
  enabled: false
  databaseURLKey: DATABASE_URL
  cursorKeyKey: DASHBOARD_CURSOR_KEY
  maxConnections: 8
  connectTimeout: 5s
  requireTLS: false
  postgresEgress:
    cidrs: []
    port: 5432
  # SQLite 파일 백엔드 (ADR 0016). 켜면 외부 PostgreSQL 대신 PVC의 SQLite 파일을 씁니다.
  # 단일 writer라 API는 replicas=1 + Recreate로 강제됩니다. PVC로 재배포·삭제→배포에도 draft가 보존됩니다.
  sqlite:
    enabled: false
    path: /data/dashboard/drafts.db
    persistence:
      size: 1Gi
      storageClass: ""
      accessMode: ReadWriteOnce

# 관리 기능(ADR 0014, #32) — Deployment/Secret 조회·수정·재배포. 명시적 opt-in입니다.
# 켜면 대시보드 SA에 secrets get/list/update, deployments update/patch 권한이 붙습니다.
# 끄면(기본) 관리 엔드포인트는 권한 부재로 fail-closed(403)됩니다.
manageWorkloads:
  enabled: false

# Resource Explorer (ADR 0018) — API discovery 기반 **조회 전용** 리소스 탐색기.
# 명시적 opt-in이며 direct 모드에서만 켤 수 있습니다(central은 로컬 informer가 없어
# 렌더 단계에서 실패합니다). 끄면(기본) 엔드포인트는 권한 판정 뒤 503이고
# UI의 Resources 진입점도 나타나지 않습니다 — 이것이 롤백 스위치입니다.
#
# 켜면 아래 resources 목록이 두 곳에 그대로 쓰입니다.
#   1) API의 allowlist(RESOURCE_EXPLORER_RESOURCES) — 여기 없는 GVR은 목록도 상세도 없습니다.
#   2) 대시보드 ServiceAccount의 ClusterRole — **get/list/watch만** 붙고 write verb는 없습니다.
# 목록에서 항목을 빼면 두 곳이 함께 줄어듭니다. 필요한 것만 남기세요.
#
# core/v1/secrets는 기본 목록에 **없습니다**. 추가하면 Explorer가 Secret "메타데이터"를
# 보여주지만(값은 서버가 제거) SA에는 secrets list/watch 권한이 붙습니다 — 그 영향을
# 감수할 때만 추가하세요. Secret 값 조회는 여전히 manageWorkloads 경로 하나뿐입니다.
resourceExplorer:
  enabled: false
  refresh: 10m
  allowCRDs: false
  resources:
    - core/v1/services
    - core/v1/configmaps
    - core/v1/serviceaccounts
    - core/v1/persistentvolumeclaims
    - core/v1/persistentvolumes
    - discovery.k8s.io/v1/endpointslices
    - batch/v1/jobs
    - networking.k8s.io/v1/ingresses
    - networking.k8s.io/v1/networkpolicies
    - autoscaling/v2/horizontalpodautoscalers
    - policy/v1/poddisruptionbudgets
    - storage.k8s.io/v1/storageclasses
  # 상세(선택한 항목 하나)만 실시간 GET입니다. 조회 경로와 예산을 공유하지 않습니다.
  detail:
    rate: 2
    burst: 5
    concurrent: 2
    timeout: 5s
    maxObjectBytes: 1048576
  # 변경 검토 dry-run (ADR 0019 Phase 1 · GitHub Issue #7) — **검토만** 합니다.
  # 적용·삭제·생성·change token·force는 없습니다.
  #
  # 두 번 opt-in해야 열립니다: resourceExplorer.enabled 그리고 dryRun.enabled.
  # 기본은 꺼짐이고 resources도 비어 있어, 이 블록은 렌더 결과에 아무것도 더하지 않습니다.
  #
  # resources는 위 resourceExplorer.resources의 **부분집합**이어야 하고,
  # denyResources는 다시 resources의 부분집합입니다. 아래는 설정으로 뚫을 수 없습니다 —
  # core secrets/serviceaccounts/nodes/namespaces, rbac.authorization.k8s.io group 전체,
  # apiextensions.k8s.io/customresourcedefinitions. 넣으면 조용히 빠지지 않고 렌더가 실패합니다.
  #
  # 켜면 deny를 뺀 최종 목록에 대해 SA에 **get·patch 두 verb만** 붙습니다.
  # dryRun=All 서버사이드 apply를 API 서버가 patch로 인가하기 때문입니다.
  dryRun:
    enabled: false
    resources: []
    denyResources: []
    timeout: 8s
    rate: 1
    burst: 3
    concurrent: 1
    maxManifestBytes: 262144
    maxObjectBytes: 1048576

redis:
  enabled: true
  image: {repository: redis, tag: 8.2.6-alpine, digest: ""}
  persistence: {enabled: false, size: 8Gi, storageClass: ""}
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 250m, memory: 128Mi}

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: dashboard.example.invalid
  tls: {enabled: false, secretName: ""}

networkPolicy:
  enabled: true
  ingress:
    namespaceSelector: {}
    podSelector: {}
    cidrs: ["10.0.0.0/8"]
  monitoring:
    enabled: false
    namespaceSelector: {}
    podSelector: {}
  dns:
    namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
    podSelector: {matchLabels: {k8s-app: kube-dns}}
  kubernetesApiCidrs: ["10.96.0.1/32"]
  external: []
  internal: []

# OpenTelemetry 수집 전환은 명시적 opt-in입니다. validate는 backend write 없이
# Agent→Gateway 경로만 검증하고, cutover는 아래 승인/측정 gate를 모두 요구합니다.
telemetry:
  mode: disabled # disabled | validate | cutover
  clusterName: ""
  image:
    repository: registry.invalid/observability-dashboard-otelcol
    tag: "0.158.0-dashboard.1"
    digest: ""
  collectorBuildVerified: false
  existingLogCollectionDisabled: false
  existingMetricCollectionDisabled: false
  existingSecret:
    name: ""
    keys:
      greptimeAuthorization: GREPTIME_OTLP_AUTHORIZATION
      quickwitAuthorization: QUICKWIT_OTLP_AUTHORIZATION
  memoryLimiter:
    limitMiB: 400
    spikeLimitMiB: 100
  agent:
    kubeletCidrs: []
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}
  gateway:
    replicas: 2
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}
    pdb: {minAvailable: 1}
  clusterCollector:
    kubeStateMetrics:
      endpoint: kube-state-metrics.monitoring.svc:8080
      namespaceSelector: {}
      podSelector: {}
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}
  backends:
    greptime:
      endpoint: ""
      database: public
      insecure: false
    quickwit:
      endpoint: ""
      index: otel-logs-v0_7
      insecure: false
    egress: []
  comparison:
    recorded: false
    kind: ""
    evidenceId: ""
    artifactHash: ""
    startedAt: ""
    endedAt: ""
    windowMinutes: 0
    baselineEvents: 0
    candidateEvents: 0
    lossPermille: -1
    p95LatencyMs: -1
    collectorCpuMillicores: -1
    collectorMemoryMiB: -1
    egressBytesPerHour: -1
    storageBytesPerDay: -1
    estimatedCostMicrosPerDay: -1
    limits:
      maxLossPermille: 10
      maxP95LatencyMs: 5000
      maxCollectorCpuMillicores: 500
      maxCollectorMemoryMiB: 512
      maxEgressBytesPerHour: 10000000000
      maxStorageBytesPerDay: 1000000000000
      maxEstimatedCostMicrosPerDay: 100000000000
