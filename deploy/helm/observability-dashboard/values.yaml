environment: dev
nameOverride: ""
fullnameOverride: ""
imagePullPolicy: IfNotPresent
secretRevision: ""

ui:
  image: {repository: observability-dashboard-web, tag: dev, digest: ""}
  replicas: 1
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 250m, memory: 128Mi}
  autoscaling: {enabled: false, minReplicas: 2, maxReplicas: 4, targetCPUUtilizationPercentage: 70}
  pdb: {enabled: false, minAvailable: 1}

api:
  image: {repository: observability-dashboard-api, tag: dev, digest: ""}
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
  autoscaling: {enabled: false, minReplicas: 2, maxReplicas: 6, targetCPUUtilizationPercentage: 70}
  pdb: {enabled: false, minAvailable: 1}
  config:
    ADDR: ":8080"
    CLUSTER_ID: dev
    CLUSTER_NAME: Development
    AUTH_MODE: none
    SCOPE_NAMESPACES: "*"
    USE_DEMO_DATA: "true"
    OIDC_ISSUER: ""
    OIDC_AUDIENCE: ""
    GREPTIME_URL: ""
    GREPTIME_DB: public
    QUICKWIT_URL: ""
    QUICKWIT_INDEX: k8s-logs
  existingSecret:
    name: ""
    keys:
      greptimeUsername: GREPTIME_USERNAME
      greptimePassword: GREPTIME_PASSWORD
      quickwitUsername: QUICKWIT_USERNAME
      quickwitPassword: QUICKWIT_PASSWORD
      redisAddr: REDIS_ADDR

# Direct is the byte-for-byte compatible default. Central mode uses only the
# shared registry and never mounts a Kubernetes service-account token.
clusterState:
  mode: direct # direct | central
  clusters: []
  trustDomain: ""
  registryEndpoint: ""
  registryServerName: ""
  tls:
    apiExistingSecret: ""
    registryExistingSecret: ""
    certKey: tls.crt
    privateKeyKey: tls.key
    caKey: ca.crt
  registry:
    image: {repository: observability-dashboard-api, tag: dev, digest: ""}
    replicas: 1
    agentPort: 9443
    queryPort: 9444
    agentService:
      type: ClusterIP
      sourceCidrs: []
    resources:
      requests: {cpu: 250m, memory: 768Mi}
      limits: {cpu: "2", memory: 1536Mi}
  limits:
    maxClusters: 64
    maxResources: 100000
    maxChunkResources: 1000
    maxMessageBytes: 4194304
    maxStateBytes: 268435456
    maxTotalStateBytes: 536870912
    ingressFrameRate: 1000
    ingressByteRate: 16777216
    ingressFrameBurst: 2000
    ingressByteBurst: 8388608
    staleTTL: 5m
    heartbeatTimeout: 45s

dashboardBuilder:
  enabled: false
  databaseURLKey: DATABASE_URL
  cursorKeyKey: DASHBOARD_CURSOR_KEY
  maxConnections: 8
  connectTimeout: 5s
  requireTLS: false
  postgresEgress:
    cidrs: []
    port: 5432

redis:
  enabled: true
  image: {repository: redis, tag: 8.2.6-alpine, digest: ""}
  persistence: {enabled: false, size: 8Gi, storageClass: ""}
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 250m, memory: 128Mi}

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: dashboard.example.invalid
  tls: {enabled: false, secretName: ""}

networkPolicy:
  enabled: true
  ingress:
    namespaceSelector: {}
    podSelector: {}
    cidrs: ["10.0.0.0/8"]
  monitoring:
    enabled: false
    namespaceSelector: {}
    podSelector: {}
  dns:
    namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
    podSelector: {matchLabels: {k8s-app: kube-dns}}
  kubernetesApiCidrs: ["10.96.0.1/32"]
  external: []
  internal: []

# OpenTelemetry 수집 전환은 명시적 opt-in입니다. validate는 backend write 없이
# Agent→Gateway 경로만 검증하고, cutover는 아래 승인/측정 gate를 모두 요구합니다.
telemetry:
  mode: disabled # disabled | validate | cutover
  clusterName: ""
  image:
    repository: registry.invalid/observability-dashboard-otelcol
    tag: "0.158.0-dashboard.1"
    digest: ""
  collectorBuildVerified: false
  existingLogCollectionDisabled: false
  existingMetricCollectionDisabled: false
  existingSecret:
    name: ""
    keys:
      greptimeAuthorization: GREPTIME_OTLP_AUTHORIZATION
      quickwitAuthorization: QUICKWIT_OTLP_AUTHORIZATION
  memoryLimiter:
    limitMiB: 400
    spikeLimitMiB: 100
  agent:
    kubeletCidrs: []
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}
  gateway:
    replicas: 2
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}
    pdb: {minAvailable: 1}
  clusterCollector:
    kubeStateMetrics:
      endpoint: kube-state-metrics.monitoring.svc:8080
      namespaceSelector: {}
      podSelector: {}
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}
  backends:
    greptime:
      endpoint: ""
      database: public
      insecure: false
    quickwit:
      endpoint: ""
      index: otel-logs-v0_7
      insecure: false
    egress: []
  comparison:
    recorded: false
    kind: ""
    evidenceId: ""
    artifactHash: ""
    startedAt: ""
    endedAt: ""
    windowMinutes: 0
    baselineEvents: 0
    candidateEvents: 0
    lossPermille: -1
    p95LatencyMs: -1
    collectorCpuMillicores: -1
    collectorMemoryMiB: -1
    egressBytesPerHour: -1
    storageBytesPerDay: -1
    estimatedCostMicrosPerDay: -1
    limits:
      maxLossPermille: 10
      maxP95LatencyMs: 5000
      maxCollectorCpuMillicores: 500
      maxCollectorMemoryMiB: 512
      maxEgressBytesPerHour: 10000000000
      maxStorageBytesPerDay: 1000000000000
      maxEstimatedCostMicrosPerDay: 100000000000
