# Observability API/BFF가 클러스터를 읽기 위한 **최소 권한**입니다. (이슈 #8)
#
# 원칙
#   - 읽기만 합니다. create/update/delete/patch가 하나도 없습니다.
#     대시보드는 조회 도구입니다. 쓰기 권한이 있으면 사고의 폭이 달라집니다.
#   - informer가 실제로 watch하는 리소스만 넣습니다. "나중에 쓸지도 모르니까"로
#     넓히지 않습니다. 권한은 넓히기는 쉽고 좁히기는 어렵습니다.
#   - **Secret과 ConfigMap이 없습니다.** 로그·메트릭 자격증명은 별도 Secret을
#     환경변수로 주입해서 씁니다. 클러스터의 Secret을 읽을 이유가 없습니다.
#   - pods/log, pods/exec, pods/portforward 하위 리소스도 없습니다.
#     로그는 Quickwit에서 옵니다. kubelet을 통해 읽지 않습니다.
#
# 확인
#   kubectl apply -f deploy/rbac/k8s-dashboard-api.yaml
#   ITEST_KUBECONFIG=~/.kube/config \
#     ITEST_SERVICE_ACCOUNT=k8s-dashboard:k8s-dashboard-api make api-itest
#
#   TestLiveDeployedServiceAccountCannotReadSecrets가 SubjectAccessReview로
#   "필요한 것은 되고, 나머지는 안 되는지"를 실제 API 서버에 물어봅니다.
---
apiVersion: v1
kind: Namespace
metadata:
  name: k8s-dashboard
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-dashboard-api
  namespace: k8s-dashboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-dashboard-api-read
rules:
  # Pod · Node · Event — Cluster Overview와 Drill-down의 기본 사실입니다.
  # Event는 코드에서 field selector(type=Warning)로 좁히지만, RBAC은 리소스 단위라
  # 여기서 더 줄일 수는 없습니다. 실제 전송량은 selector가 결정합니다.
  - apiGroups: [""]
    resources: ["pods", "nodes", "events"]
    verbs: ["get", "list", "watch"]

  # Workload. replicasets는 **metadata-only informer**로 받지만
  # RBAC 검사는 동일한 리소스 권한을 봅니다.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-dashboard-api-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-dashboard-api-read
subjects:
  - kind: ServiceAccount
    name: k8s-dashboard-api
    namespace: k8s-dashboard
